up1_pages.settings:
  type: config_object
  label: 'Pages personnelles'
  mapping:
    activate_maintenance:
      type: boolean
      label: 'Mode maintenance (modifications des pages personnelles bloquées)'
    url_ws:
      type: uri
      label: 'URL du web service wsgroups'
    search_user:
      type: string
      label: 'Requête wsgroups des listes'
    filtre_faculty:
      type: string
      label: 'Filtre enseignants-chercheurs'
    filtre_student:
      type: string
      label: 'Filtre doctorants'
    other_filters:
      type: string
      label: 'Filtres supplémentaires'
    search_user_page:
      type: string
      label: "Requête wsgroups d'une personne"
    url_hal_api:
      type: uri
      label: 'URL du web service HAL'
    url_userphoto:
      type: string
      label: 'URL du web service userphoto'
    ws:
      type: mapping
      label: 'Disponibilité des web services'
      mapping:
        wsgroups_enabled:
          type: boolean
          label: 'Appeler wsgroups'
        hal_enabled:
          type: boolean
          label: 'Appeler HAL'
        failure_threshold:
          type: integer
          label: "Nombre d'échecs avant suspension des appels"
        cooldown:
          type: integer
          label: 'Durée de suspension des appels (secondes)'
        connect_timeout:
          type: integer
          label: 'Délai de connexion (secondes)'
        timeout:
          type: integer
          label: "Délai de réponse, fiche d'une personne (secondes)"
        list_timeout:
          type: integer
          label: 'Délai de réponse, trombinoscopes (secondes)'
        sync_timeout:
          type: integer
          label: 'Délai de réponse, synchronisation (secondes)'
        cache_ttl:
          type: integer
          label: 'Durée de fraîcheur des données (secondes)'
        stale_ttl:
          type: integer
          label: 'Conservation des dernières données connues (secondes)'
    sync:
      type: mapping
      label: 'Synchronisation'
      mapping:
        interval:
          type: integer
          label: 'Intervalle entre deux synchronisations par le cron (secondes)'
        min_interval:
          type: integer
          label: 'Intervalle minimal entre deux synchronisations demandées par URL (secondes)'
    hal:
      type: mapping
      label: 'Publications HAL'
      mapping:
        refresh_interval:
          type: integer
          label: 'Intervalle entre deux rafraîchissements des encarts par le cron (secondes)'
