    items:
      - heading
      - bold
      - underline
      - sourceEditing
      - italic
      - showBlocks
      - outdent
      - textPartLanguage
      - nbsp
      - indent
      - drupalMedia
      - drupalInsertImage
      - insertTable
      - removeFormat
      - alignment
      - horizontalLine
      - numberedList
      - bulletedList
      - undo
      - specialCharacters
      - redo
      - subscript
      - superscript
      - blockQuote
      - toggleInlineQuote
      - link
      - abbreviation
      - a11ychecker
      - drupalInsertFile
  plugins:
