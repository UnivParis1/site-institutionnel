notification_mail_admin:
  subject: 'Demande de confirmation du maintien du site [micro_site:name] '
  message: "Vous recevez ce message car vous êtes référencé comme webmestre du site : [micro_site:name].\r\n\r\nIl s'agit d'un courriel automatique généré par la plateforme Drupal.\r\n\r\nAfin de confirmer que ce site doit rester publié, nous vous remercions de nous envoyer un simple message à assistance-dsiun@univ-paris1.fr, avec lagadic@univ-paris1.fr en copie, en indiquant que vous souhaitez maintenir le site en ligne. Nous repousserons alors sa date de dépublication, actuellement prévue dans [micro_site:remaining-days] jours, d'une année supplémentaire.\r\n\r\nPourquoi cette démarche ?\r\n\r\nComme cela a été présenté lors de la formation Drupal, un mécanisme de dépublication programmée a été mis en place afin d'éviter la conservation de sites devenus obsolètes ou abandonnés (par exemple lorsqu'une formation, un projet ou un axe de recherche cesse son activité sans que le site associé ne soit fermé).\r\n\r\nDans ce cadre, les sites de ce type font l'objet d'une vérification annuelle. Vous recevrez donc chaque année un courriel vous invitant à confirmer que le site dont vous avez la responsabilité doit rester accessible.\r\n\r\nPour les sites institutionnels majeurs (composantes, écoles doctorales, etc.), la période de dépublication programmée a été fixée à dix ans, l'établissement étant naturellement informé de toute évolution concernant ces structures.\r\n\r\nCalendrier des rappels automatiques\r\n\r\nTrois messages sont envoyés avant la date prévue de dépublication :\r\n\r\nun premier rappel un mois avant l'échéance ;\r\nun deuxième rappel une semaine avant ;\r\nun dernier rappel la veille.\r\n\r\nEn cas d'absence de réponse\r\n\r\nAucune inquiétude à avoir : le site ne sera pas supprimé. Il sera simplement dépublié, ce qui signifie qu'il ne sera plus accessible au public sur l'Internet. L'ensemble de ses contenus sera conservé et les webmestres continueront à y avoir accès."
