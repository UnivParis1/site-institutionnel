id: 30_formulaire_d_inscription_renc
title: "30 - Formulaire d'inscription – Rencontre Pro IAES 2025"
description: "<p>Ce formulaire a pour objectif de recueillir les inscriptions des structures souhaitant participer à la Rencontre Professionnelle IAES 2025, organisée par l'IAES-EDS. L’événement se tiendra le mardi 6 mai 2025 de 10h à 13h au centre Pierre Mendès-France (Paris 13e) Amphi I. Il permettra aux entreprises, administrations et associations de rencontrer des étudiants à la recherche d’un stage entre juin et août 2025 (durée minimum : 2 mois). Les informations recueillies permettront d’organiser au mieux leur accueil et de faciliter les échanges avec les étudiants.</p><p>&nbsp;</p>"
categories: {  }
elements: |-
  informations_sur_votre_structure:
    '#type': fieldset
    '#title': 'INFORMATION SUR VOTRE STRUCTURE'
    raison_sociale_ou_denomination_sociale:
      '#type': textfield
      '#title': 'Raison sociale ou dénomination sociale'
      '#title_display': before
      '#minlength': 1
      '#maxlength': 50
      '#required': true
    type_de_structure:
      '#type': webform_select_other
      '#title': 'Type de structure'
      '#description': '<p>Veuillez indiquer la nature juridique ou organisationnelle de votre structure. Cette information nous permet de mieux orienter les étudiants en fonction de leurs intérêts et des secteurs représentés (ex. : cabinet d’avocat, service RH d’une entreprise, association loi 1901, collectivité territoriale, ministère, etc.).</p>'
      '#help': '<p>Veuillez indiquer la nature juridique ou organisationnelle de votre structure. Cette information nous permet de mieux orienter les étudiants en fonction de leurs intérêts et des secteurs représentés (ex. : cabinet d’avocat, service RH d’une entreprise, association loi 1901, collectivité territoriale, ministère, etc.).</p>'
      '#description_display': tooltip
      '#options':
        101: 'Cabinet d’avocat'
        102: 'Service RH'
        103: Association
        104: 'Administration publique'
        105: Autre
      '#select2': true
      '#required': true
    secteur_d_activite:
      '#type': textfield
      '#title': "Secteur d'activité"
      '#description': '<p>Secteur d’activité : Veuillez indiquer le domaine spécifique dans lequel votre structure évolue (par exemple, droit, santé, éducation, finance, environnement, etc.). Cela nous permet de mieux comprendre vos activités et d’orienter les étudiants vers des stages en adéquation avec leurs aspirations professionnelles.</p>'
      '#help': '<p>Secteur d’activité : Veuillez indiquer le domaine spécifique dans lequel votre structure évolue (par exemple, droit, santé, éducation, finance, environnement, etc.). Cela nous permet de mieux comprendre vos activités et d’orienter les étudiants vers des stages en adéquation avec leurs aspirations professionnelles.</p>'
      '#description_display': tooltip
      '#required': true
  personne_referente:
    '#type': fieldset
    '#title': 'PERSONNE REFERENTE'
    nom:
      '#type': textfield
      '#title': Nom
      '#help': '<p>Nom de famille de la personne référente au sein de votre structure</p>'
      '#minlength': 1
      '#maxlength': 50
      '#required': true
    prenom:
      '#type': textfield
      '#title': Prénom
      '#help': '<p>Prénom de la personne référente au sein de votre structure</p>'
      '#minlength': 1
      '#maxlength': 50
      '#required': true
    fonction:
      '#type': textfield
      '#title': Fonction
      '#help': '<p>Fonction de la personne référente au sein de votre structure</p>'
      '#minlength': 1
      '#maxlength': 50
      '#required': true
    telephone:
      '#type': webform_telephone
      '#title': Téléphone
      '#description': '<p class="text-align-right">+ indicatif du pays suivi du Numéro de téléphone (Fixe ou portable)</p><p class="text-align-right">Exemple <strong>+33</strong>612345123</p><p class="text-align-right">Exemple <strong>+33</strong>144077737</p><p>&nbsp;</p>'
      '#help': '<p class="text-align-right">+ indicatif du pays suivi du Numéro de téléphone (Fixe ou portable)</p><p class="text-align-right">Exemple <strong>+33</strong>612345123</p><p class="text-align-right">Exemple <strong>+33</strong>144077737</p><p>&nbsp;</p>'
      '#required': true
      '#type__access': false
      '#phone__help': Téléphone
      '#ext__access': false
      '#choices': true
      '#phone__international_initial_country': FR
    confimez_votre_adresse_courriel:
      '#type': webform_email_confirm
      '#title': 'Adresse courriel'
      '#required': true
      '#confirm__title': 'Confirmez votre adresse courriel'
  rencontre_pro_2025:
    '#type': fieldset
    '#title': 'RENCONTRE PRO 2025'
    participation_a_l_evenement:
      '#type': radios
      '#title': ' Participation à l’événement'
      '#options':
        201: 'Je souhaite être présent.e le 6 mai 2025 (10h-13h)'
        202: "Je ne souhaite pas être présent.e mais je souhaite être informé.e d'autres évènements"
      '#options__properties': ''
    nombre_de_representants_presents_le_jour_j:
      '#type': number
      '#title': 'Nombre de représentants présents le jour J'
      '#required': true
      '#states':
        visible:
          ':input[name="participation_a_l_evenement"]':
            value: '201'
      '#min': 1
      '#max': 10
      '#step': 1
  offre_de_stage:
    '#type': fieldset
    '#title': 'OFFRE DE STAGE'
    '#states':
      visible:
        ':input[name="participation_a_l_evenement"]':
          '!value': '202'
    souhaitez_vous_proposer_des_offres_de_stage_a_cette_occasion:
      '#type': radios
      '#title': 'Souhaitez-vous proposer des offres de stage à cette occasion ?'
      '#options':
        301: Oui
        302: Non
        304: 'Pas encore défini'
      '#states':
        visible:
          ':input[name="participation_a_l_evenement"]':
            value: '201'
      '#options__properties': ''
    periode_s_de_stage_proposee_s:
      '#type': radios
      '#title': 'Période(s) de stage proposée(s)'
      '#description': '<p>La période de stage obligatoire pour nos étudiants est au minimum de 2 mois et ne peut excéder 6 mois&nbsp;</p>'
      '#help': '<p>La période de stage obligatoire pour nos étudiants est au minimum de 2 mois et ne peut excéder 6 mois &nbsp;</p>'
      '#options':
        401: 'Juin – Juillet'
        402: 'Juillet – Août'
        404: 'Juin – Août'
        405: 'Autre :'
      '#states':
        visible:
          ':input[name="souhaitez_vous_proposer_des_offres_de_stage_a_cette_occasion"]':
            value: '301'
      '#options__properties': ''
  autre:
    '#type': fieldset
    '#title': Autre
    '#states':
      visible:
        ':input[name="periode_s_de_stage_proposee_s"]':
          value: '405'
    date_de_debut:
      '#type': date
      '#title': 'Date de début'
    date_de_fin:
      '#type': date
      '#title': 'Date de fin'
    druee_du_stage:
      '#type': fieldset
      '#title': 'Druée du stage'
      la_duree_du_stage_est_superieure_a_2_mois:
        '#type': checkbox
        '#title': 'La durée du stage est supérieure à 2 mois'
      nombre_de_mois:
        '#type': number
        '#title': 'Nombre de mois'
        '#states':
          visible:
            ':input[name="la_duree_du_stage_est_superieure_a_2_mois"]':
              unchecked: true
        '#min': 0
        '#max': 1
      nombre_de_mois0:
        '#type': number
        '#title': 'Nombre de mois.'
        '#states':
          visible:
            ':input[name="la_duree_du_stage_est_superieure_a_2_mois"]':
              checked: true
        '#min': 2
        '#max': 6
      et_nombre_de_jour:
        '#type': number
        '#title': 'Et nombre de jour'
        '#states':
          visible:
            ':input[name="la_duree_du_stage_est_superieure_a_2_mois"]':
              checked: true
        '#min': 1
        '#max': 31
      et_nombre_de_jour0:
        '#type': number
        '#title': 'Et nombre de jour.'
        '#states':
          visible:
            ':input[name="la_duree_du_stage_est_superieure_a_2_mois"]':
              unchecked: true
        '#min': 0
        '#max': 31
      une_gratification_est_prevue:
        '#type': radios
        '#title': 'Une gratification est prévue'
        '#multiple': false
        '#description': '<p>Article 5 – Gratification - Avantages<br>En France, lorsque la durée du stage est supérieure à deux mois consécutifs ou non, celui-ci fait obligatoirement l’objet d’une gratification, sauf en cas de règles particulières applicables dans certaines collectivités d’outre-mer françaises et pour les stages relevant de l’article L4381-1 du code de la santé publique</p>'
        '#description_display': after
        '#options':
          701: Oui
          702: Non
        '#options_display': buttons_horizontal
        '#states':
          invisible:
            ':input[name="la_duree_du_stage_est_superieure_a_2_mois"]':
              unchecked: true
        '#options__properties': ''
