  confirmation_title: "Rencontre Pro 2025 - Confirmation d'inscription - 06/05/2025 Amph I centre PMF"
  confirmation_message: '<p>Chère/cher [webform_submission:values:prenom] [webform_submission:values:nom],</p><p>Nous avons le plaisir de confirmer votre inscription à l’événement :</p><p>&nbsp;</p><p><strong>"Rencontre Professionnelle IAES 2025"</strong></p><ul><li><strong>Date :</strong> Mardi 6 mai 2025</li><li><strong>Heure :</strong> 10h00 à 13h00</li><li><strong>Lieu :</strong> Amphithéâtre I, Centre Pierre Mendès France</li><li><strong>Adresse :</strong> 31, rue Baudricourt, 75013 Paris</li></ul><p>&nbsp;</p><p>L’accueil sera ouvert à partir de 09h15, et l’accès à l’événement se fera sur présentation de la confirmation qui vous a été transmise par courriel.</p><p>&nbsp;</p><p>Nous vous remercions pour l’intérêt que vous portez à la formation de nos étudiants</p><p>&nbsp;</p><p>Dans l’attente de vous accueillir, nous vous prions d’agréer, Chère/cher [webform_submission:values:prenom] [webform_submission:values:nom], l’expression de nos salutations les plus distinguées.</p><p>&nbsp;</p><p><strong>L’équipe des stages – Institut AES</strong><br>Institut Administration Économique et Sociale<br>École de Droit de la Sorbonne<br>Email contact : evenementsIAES@univ-paris1.fr<br>&nbsp;</p>'
