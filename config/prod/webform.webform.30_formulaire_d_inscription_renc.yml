  submission_label: 'Confirmation de votre inscription à la Rencontre Professionnelle IAES 2025'
  submission_exception_message: "<p>Madame, Monsieur,</p><p>Nous vous remercions chaleureusement pour votre inscription à la Rencontre Pro 2025, organisée par l'IAES-EDS Université Paris 1 Panthéon-Sorbonne.<br>Nous accusons bonne réception de votre formulaire, et sommes ravis de compter votre structure parmi les participants à cette 8ᵉ édition, qui se tiendra le mardi 6 mai 2025 de 10h à 13h, au centre Pierre Mendès-France, Amphithéâtre I, 31 rue Baudricourt 75013 Paris.</p><p>Votre engagement à accompagner nos étudiants dans leur parcours professionnel est précieux, et nous nous réjouissons des échanges à venir.</p><p>Nous reviendrons très prochainement vers vous avec les dernières informations logistiques liées à l’événement.</p><p>Avec nos sincères remerciements,<br>L’équipe des stages – Institut AES<br>Université Paris 1 Panthéon-Sorbonne</p>"
