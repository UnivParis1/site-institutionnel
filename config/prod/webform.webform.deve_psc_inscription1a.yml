id: deve_psc_inscription1a
title: 'DEVE PSC - FAQ-Inscription1a'
description: '<p>Informations et aides sur les inscriptions pour les personnes ayant fait une procédure préalable de candidature.&nbsp;</p>'
categories:
  - 'FAQ DEVE IA'
elements: |-
  avis_favorable_pour_m_inscrire:
    '#type': radios
    '#title': "J'ai reçu un avis favorable pour m'inscrire, suite à ma candidature à Paris 1 Panthéon-Sorbonne, et je souhaite :  "
    '#options':
      "savoir comment m'inscrire": "savoir comment m'inscrire"
      'connaître le calendrier des inscriptions': 'connaître le calendrier des inscriptions'
      "connaître le tarif d'une inscription": "connaître le tarif d'une inscription"
      'savoir comment annuler mon inscription': 'savoir comment annuler mon inscription'
      'résoudre un problème lié à mon inscription': 'résoudre un problème lié à mon inscription / ma réinscription'
    '#options_display': buttons_horizontal
    '#options__properties': ''
  markup:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="avis_favorable_pour_m_inscrire"]':
          value: "savoir comment m'inscrire"
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Je peux trouver les informations concernant les inscriptions administratives sur la page web suivante :&nbsp;</p><p><a href="https://www.pantheonsorbonne.fr/inscription/inscription-administrative" target="_blank" rel="noreferrer noopener">https://www.pantheonsorbonne.fr/inscription/inscription-administrative</a></p><p>Pour obtenir des informations ou candidater pour une <strong>réorientation</strong>, je peux me rendre sur le lien suivant : <a class="moz-txt-link-freetext" href="https://www.pantheonsorbonne.fr/inscription/reorientation" moz-do-not-send="true">https://www.pantheonsorbonne.fr/inscription/reorientation</a> , à condition d''être bien inscrit pour l''année en cours dans l''enseignement supérieur français.&nbsp;</p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="ee568df1830f785c91cd1c77edfb7729d"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="ecad16703ffe7fa640f0ccb8ddbb90273"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-ia/faq-ia-cas-particulier" rel="noopener noreferrer">PARTIELLEMENT, mais mon cas est un peu particulier</a></li><li data-list-item-id="ec696a92275d8e3f6d1d86a00f82ee5e9"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-ia/faq-ia-cas-particulier" rel="noopener noreferrer">NON</a></li></ul>'
  calendrier_ia:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="avis_favorable_pour_m_inscrire"]':
          value: 'connaître le calendrier des inscriptions'
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Je peux trouver les informations concernant les inscriptions administratives sur la page web suivante :</p><p><a href="https://www.pantheonsorbonne.fr/inscription/inscription-administrative" rel="noreferrer noopener">https://www.pantheonsorbonne.fr/inscription/inscription-administrative</a></p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="ec049fa59597f3aef9d1e07827e70c7dc"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="efb7be1c90bbb72c77dcd5e97a6c1f24c"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  annulation_ia:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="avis_favorable_pour_m_inscrire"]':
          value: 'savoir comment annuler mon inscription'
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Après avoir informé mon secrétariat pédagogique de ma volonté d''abandonner la formation, je dois <strong>IMPÉRATIVEMENT</strong>&nbsp;remplir le formulaire de demande d''annulation que je peux trouver sur la page de l''ENT/intranet à l''adresse suivante :<br><a href="https://ent-intranet.pantheonsorbonne.fr/procedure/annulation-dinscription">https://ent-intranet.pantheonsorbonne.fr/procedure/annulation-dinscription</a></p><p><strong>ATTENTION </strong>: les annulations sont soumises à conditions, et ne peuvent se faire tout au long de l''année. Les demandes se faisant :</p><ul><li data-list-item-id="e5dbebc819239490844b8dcd6aaac6468">avant le 1er novembre, le remboursement de l''annulation sera automatique</li><li data-list-item-id="ee4e46807557a6a5b528983af3b2ed344">entre le 1er novembre&nbsp; et le 1er décembre, le remboursement, suite à une annulation, doit passer en commission</li><li data-list-item-id="e73b1b87fd51f5fc568ec4bdf626afef7">au-delà du 1er l''annulation n''est plus possible. Seul l''arrêt de formation est autorisé, mais ne permet aucun remboursement, et n''annule pas l''inscription.</li></ul><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="ef33320613112502cb8ee8c6dda876a28"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e7fc2e5d9b4d89a445f20ff5e2b25f01c"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  mon_probleme_est_le_suivant:
    '#type': radios
    '#title': 'Mon problème est le suivant :  '
    '#options':
      "Je suis interdit d'inscription": "Je suis interdit d'inscription -- Comment régler mon problème ? "
      "Je n'ai pas noté mon numéro d'étudiant à la fin de l'enregistrement en ligne": "Je n'ai pas noté mon numéro d'étudiant à la fin de l'enregistrement en ligne -- Où le trouver ? "
      "J'ai perdu ma carte, on me l'a volé, je l'ai cassée": "J'ai perdu ma carte, on me l'a volé, je l'ai cassée -- Comment en obtenir une autre ? "
      "Je n'ai toujours pas reçu ma carte.": "Je n'ai toujours pas reçu ma carte. -- Dois-je m'en inquiéter ?"
      'Mon numéro CVEC est "invalide" lorsque je le renseigne': 'Mon numéro CVEC est "invalide" lorsque je le renseigne -- Que dois-je faire ? '
      "Je n'arrive pas à avoir un n° CVEC ": "Je n'arrive pas à avoir un n° CVEC  -- Que puis-je faire ?"
      "J'ai un problème relatif au paiement des frais de scolarité": "J'ai un problème relatif au paiement des frais de scolarité"
    '#states':
      visible-slide:
        ':input[name="avis_favorable_pour_m_inscrire"]':
          value: 'résoudre un problème lié à mon inscription'
    '#options__properties': ''
  pb_interdit:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="mon_probleme_est_le_suivant"]':
          value: "Je suis interdit d'inscription"
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p><strong>Afin de savoir pourquoi mon dossier est bloqué</strong> (livre non rendu en bibliothèque, non paiement des frais, passage en cursus supérieur non justifié, pièce manquante, changement de prénom d''usage, etc.), <strong>je dois envoyer un ticket au service des inscriptions administratives</strong> via <a href="mailto:Inscriptions-Administratives@univ-paris1.fr?subject=Question%20sur%20un%20interdit%20qui%20bloque%20mon%20dossier">ce formulaire</a>&nbsp;.</p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e2be391c6bdb184b50e9fc642a77534df"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e6e9c04f25a90dc86bf7f47bee8cf264b"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  retrouver_numetu:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="mon_probleme_est_le_suivant"]':
          value: "Je n'ai pas noté mon numéro d'étudiant à la fin de l'enregistrement en ligne"
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Je peux retrouver mon numéro d''étudiant sur l''Environnement Numérique de Travail (ENT)/intranet dans l''outil "<strong>Dossier étudiant</strong>" ou "<strong>exams</strong>" ou "<strong>compte -&gt; mon compte Paris 1 -&gt; modification des données personnelles -&gt; coordonnées</strong>", etc.</p><p>Si je suis bloqué et n''arrive pas à accéder à mon ENT/intranet, je peux, en dernier recours :&nbsp;</p><ul><li data-list-item-id="ea41f26db51ef64c5e4ef17335f3295b6"><a href="https://www.pantheonsorbonne.fr/aide-numerique">Consulter la page d''aide informatique et numérique</a></li><li data-list-item-id="eaa1de669307191f13b9270c7a6c2bebf">appeler l''assistance téléphonique au <a href="tel:0189684949">01 89 68 49 49</a></li><li data-list-item-id="e060e9f5b1e1e73d58d801d4abac1d5d0">envoyer un ticket <em>via </em><a href="mailto:Inscriptions-Administratives@univ-paris1.fr?subject=Je%20souhaite%20conna%C3%AEtre%20mon%20num%C3%A9ro%20%C3%A9tudiant">ce formulaire</a></li></ul><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="ecb4fbfaff871a77d1bee629cbedd7ac0"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e1269607eaab09726e6caa595b68fd93e"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  carte_perdue:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="mon_probleme_est_le_suivant"]':
          value: "J'ai perdu ma carte, on me l'a volé, je l'ai cassée"
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p><strong>Pour obtenir une nouvelle carte d''étudiant, je peux remplir le formulaire de réédition</strong> se trouvant sur mon ENT/intranet :&nbsp;</p><p><a href="https://ent-intranet.pantheonsorbonne.fr/refaire-sa-carte-etudiante" target="_blank" rel="noreferrer noopener">https://ent-intranet.pantheonsorbonne.fr/refaire-sa-carte-etudiante</a></p><p>A NOTER :</p><ul><li data-list-item-id="ea6ba139b12791af0ee5d35863fe6ee19">des frais de réédition de la carte peuvent s''appliquer</li><li data-list-item-id="e77be0eb46bc20696270020e3f7198bec"><strong>pas </strong>de réédition possible entre début juin et fin août</li></ul><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e00441cf5fdc0c3e5599adb29f05052af"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e8c07f82d2e9791846a45af120c69f0c3"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  retard_carte:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="mon_probleme_est_le_suivant"]':
          value: "Je n'ai toujours pas reçu ma carte."
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p><strong>Le temps de traitement d''un dossier et de l''édition de la carte et du certificat de scolarité peut prendre du temps en période d''affluence</strong> (jusqu''à 15 jours).</p><p><strong>D''autres causes</strong> peuvent empêcher l’acheminement par voie postale de votre carte :&nbsp;</p><ul><li data-list-item-id="ed7ee5df7f486eca35818380226e38c82">une adresse erronée</li><li data-list-item-id="e2ddf6b2c6bee7c16fec8bacd486cbf54">une adresse non valide (par exemple vous avez déménagé, et pas mis à jour votre adresse)</li><li data-list-item-id="e96b8e24b55c7c2e2ae90526a5dedbddd">le courrier est parti chez vos parents</li></ul><p>Veillez donc à bien renseigner correctement votre adresse postale.</p><p><strong>Autre cause de retard</strong> : vous n''avez pas réglé vos frais, ou pas déposé les pièces justificatives.&nbsp;</p><p>Veillez donc à <strong>surveiller votre boîte mail</strong> (et regarder jusque dans vos Spams) pour voir si vous n''avez pas reçu une relance.</p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e75f1098856a04190443b2fd021c76ae5"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="ec1412475078f9541b7fb397cfdaae452"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  cvec_invalide:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="mon_probleme_est_le_suivant"]':
          value: 'Mon numéro CVEC est "invalide" lorsque je le renseigne'
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p><strong>Je dois d''abord vérifier que je n''ai pas fait d''erreur.</strong></p><p>Par exemple entre mon Nom/Prénom,<strong>&nbsp;sur le </strong><a href="https://cvec.etudiant.gouv.fr/" target="_blank" rel="noreferrer noopener"><strong>site du CROUS</strong></a>.</p><p>En cas de difficulté, je peux envoyer un ticket via <a href="mailto:Inscriptions-Administratives@univ-paris1.fr?subject=Mon%20n%C2%B0%20CVEC%20est%20%22invalide%22">ce formulaire</a>&nbsp;en communiquant obligatoirement :</p><ul><li data-list-item-id="e94d8609262aab84aac4e6ad8c30c488c">mon n° CVEC,</li><li data-list-item-id="e6ccbe657bf40b95cf69d3b2467700ef0">mon n° d''étudiant et/ou mon identifiant de préinscription&nbsp;</li></ul><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="ebd6c8b1b9f1d3a42b7fbc37f0510a3f2"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e9e90a17f08e12086cb41eaba32afa139"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  avoir_cvec:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="mon_probleme_est_le_suivant"]':
          value: "Je n'arrive pas à avoir un n° CVEC "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p><strong>La CVEC est indépendante des frais d''inscription de l''université, même si elle reste obligatoire pour pouvoir s''inscrire.</strong>&nbsp;</p><p>Je&nbsp; peux trouver les informations concernant la CVEC sur<a href="https://cvec.etudiant.gouv.fr/" target="_blank" rel="noreferrer noopener"> la page WEB du CROUS</a> dédiée. <strong>En cas de problème l''université ne pourra pas le résoudre.</strong> Il faut impérativement et exclusivement passer par le CROUS.</p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e1ddf5148ce8f8c4fde61218733fbc8f2"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e6966780a120c93f74adc64d7fb081932"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  mon_probleme_lie_au_paiement_est_le_suivant:
    '#type': radios
    '#title': 'Mon problème lié au paiement est le suivant :  '
    '#options':
      "Je n'ai pas réussi à finaliser le paiement à la fin de mon inscription": "Je n'ai pas réussi à finaliser le paiement à la fin de mon inscription -- Comment faire ?"
      'Je rencontre des difficultés de paiement': 'Je rencontre des difficultés de paiement -- Puis-je payer en plusieurs fois ? '
      "J'avais choisi le paiement en plusieurs fois mais mon compte n'était pas suffisamment approvisionné et/ou ma carte est en opposition ou arrivée à échance et/ou l'un des paiements fractionnés n'a pas été honoré. ": "J'avais choisi le paiement en plusieurs fois mais mon compte n'était pas suffisamment approvisionné et/ou ma carte est en opposition ou arrivée à échance et/ou l'un des paiements fractionnés n'a pas été honoré. "
    '#states':
      visible-slide:
        ':input[name="mon_probleme_est_le_suivant"]':
          value: "J'ai un problème relatif au paiement des frais de scolarité"
    '#options__properties': ''
  finalisation_paiement:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="mon_probleme_lie_au_paiement_est_le_suivant"]':
          value: "Je n'ai pas réussi à finaliser le paiement à la fin de mon inscription"
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Si je n''ai pas pu finaliser le paiement en ligne, mon inscription est alors en attente de paiement. Il est impossible de revenir en arrière, <strong>je dois donc procéder au règlement en demandant un lien de paiement</strong> à <a href="mailto:regiepmf@univ-paris1.fr">regiepmf@univ-paris1.fr</a><strong> ou bien</strong> je peux envoyer un chèque à l''ordre : <strong>"agent comptable université Paris 1" avec mon n° d''étudiant et&nbsp; NOM au dos du chèque</strong>.</p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="ebb632132f247c72a47bfd395272fa98d"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e941fa4983510ecf5333d5249a977c0f3"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  paiement_x_fois:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="mon_probleme_lie_au_paiement_est_le_suivant"]':
          value: 'Je rencontre des difficultés de paiement'
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Le paiement en 3 fois est impossible sur place&nbsp;(<strong>uniquement </strong><em><strong>via </strong></em><strong>le web par carte bancaire et ce jusqu''au 15 octobre</strong> de l''année en cours).</p><p><em>A noter : sur mon espace bancaire personnel, la somme affichée correspond au montant final total que j''aurai payé à l''issue des 3 paiements. Même si ce n''est pas visible, cette somme sera bien automatiquement divisée par trois (si j''ai préalablement choisi cette option).</em></p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e0af1133ce91d7fcfb65921d6bb502299"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e3dac9a73888d48813916cd0f29f6fb63"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  regul_paiement:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="mon_probleme_lie_au_paiement_est_le_suivant"]':
          value: "J'avais choisi le paiement en plusieurs fois mais mon compte n'était pas suffisamment approvisionné et/ou ma carte est en opposition ou arrivée à échance et/ou l'un des paiements fractionnés n'a pas été honoré. "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p><strong>Je serai contacté par l''Agence comptable qui m''enverra un lien de paiement</strong> afin de régulariser ma situation et enlever l''interdit qui aura été mis sur mon inscription.</p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="ebaa37077798eb143cde3393a826aac55"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e834b0acdfbfb0854964fe6f908612e38"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  tarifs_ia:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="avis_favorable_pour_m_inscrire"]':
          value: "connaître le tarif d'une inscription"
    '#wrapper_attributes':
      class:
        - faqtextreponse
