id: dif_26_27
title: 'DIF 26-27'
description: ''
categories: {  }
elements: |-
  criteres_1:
    '#type': radios
    '#title': 'Critères 1'
    '#description': '<p>Je suis dans l’une des situations suivantes :<br>&nbsp;</p><ul><li>Étudiant avec le statut de réfugié, demandeur d’asile ou apatride ou bénéficiant de la protection subsidiaire ou temporaire</li><li>Titulaire d’un DU Passerelle</li><li>Inscription dans une formation en apprentissage et titulaire d’un contrat d’alternance (ou stagiaire de la formation professionnelle)</li><li>Titulaire d’une bourse du gouvernement français (BGF)</li><li>Étudiant en programme d’échange<br>&nbsp;</li></ul>'
    '#title_display': invisible
    '#description_display': before
    '#options': yes_no
    '#options_display': buttons_horizontal
    '#options__properties': ''
  criteres_2:
    '#type': radios
    '#title': 'Critères 2'
    '#description': "<p>Je m'inscris dans le cadre d’un double diplôme, d’une formation délocalisée ou d’un diplôme conjoint.<br>&nbsp;</p>"
    '#title_display': invisible
    '#description_display': before
    '#options': yes_no
    '#options_display': buttons_horizontal
    '#states':
      visible-slide:
        ':input[name="criteres_1"]':
          value: Non
    '#options__properties': ''
  criteres_3:
    '#type': radios
    '#title': 'Critères 3'
    '#description': '<p>Je suis ressortissant d’un pays de l’UE, de l’EEE, de Suisse, d’Andorre, de Monaco ou du Québec.<br>&nbsp;</p>'
    '#title_display': invisible
    '#description_display': before
    '#options': yes_no
    '#options_display': buttons_horizontal
    '#states':
      visible-slide:
        ':input[name="criteres_2"]':
          value: Non
    '#options__properties': ''
  criteres_4:
    '#type': radios
    '#title': 'Critères 4'
    '#description': '<p>Je suis ressortissant d’un pays extra-communautaire inscrit sur la liste des 44 pays les moins avancés définie par l’ONU.<br>&nbsp;</p>'
    '#title_display': invisible
    '#description_display': before
    '#options': yes_no
    '#options_display': buttons_horizontal
    '#states':
      visible-slide:
        ':input[name="criteres_3"]':
          value: Non
    '#options__properties': ''
  criteres_5:
    '#type': radios
    '#title': 'Critères 5'
    '#description': "<p>Je suis dans l’une des situations suivantes :<br>&nbsp;</p><ul><li>Fiscalement domicilié en France ou rattaché à un foyer fiscal domicilié en France depuis au moins deux ans</li><li>Titre de séjour «&nbsp;membre de famille d'un citoyen de l’Union/EEE/Suisse » (ou d’un titre de même nature reconnu)</li><li>Carte de résident de longue durée en France</li><li>Mineur dont les parents ou tuteurs légaux sont titulaires d’une carte de résident</li><li>Inscription en doctorat ou HDR</li><li>Inscrit dans un établissement d'enseignement supérieur public français ou centre de FLE avant la rentrée 2019 et sans discontinuité depuis</li><li>Inscription en CPGE<br>&nbsp;</li></ul>"
    '#title_display': invisible
    '#description_display': before
    '#options': yes_no
    '#options_display': buttons_horizontal
    '#states':
      visible-slide:
        ':input[name="criteres_4"]':
          value: Non
    '#options__properties': ''
  exoneration_totale:
    '#type': webform_message
    '#states':
      visible-slide:
        ':input[name="criteres_1"]':
          value: Oui
    '#message_type': info
    '#message_message': '<p><strong>► Je ne paie aucun droit d’inscription aux diplômes nationaux (exonération totale).</strong></p><p>&nbsp;</p>'
  droits_inscription_diplome:
    '#type': webform_message
    '#states':
      visible-slide:
        ':input[name="criteres_1"]':
          value: Non
        ':input[name="criteres_2"]':
          value: Oui
    '#message_type': info
    '#message_message': '<p><strong>►&nbsp;Je paie les droits d’inscription prévus par le diplôme (différents des droits différenciés).</strong></p><p>&nbsp;</p>'
  exoneration_partielle:
    '#type': webform_message
    '#states':
      visible-slide:
        - ':input[name="criteres_3"]':
            value: Oui
        - xor
        - ':input[name="criteres_4"]':
            value: Oui
        - xor
        - ':input[name="criteres_5"]':
            value: Oui
    '#message_type': info
    '#message_message': '<p><strong>►&nbsp;Je paie les droits d’inscription selon les tarifs nationaux (exonération partielle).</strong></p><p>&nbsp;</p>'
  pas_exoneration:
    '#type': webform_message
    '#states':
      visible-slide:
        ':input[name="criteres_5"]':
          value: Non
    '#message_type': info
    '#message_message': "<p><strong>►&nbsp;Je paie les droits différenciés (pas d'exonération).</strong></p><p>&nbsp;</p>"
  actions:
    '#type': webform_actions
    '#title': "Bouton(s) d'envoi"
    '#submit_hide': true
    '#update_hide': true
    '#wizard_prev_hide': true
    '#wizard_next_hide': true
