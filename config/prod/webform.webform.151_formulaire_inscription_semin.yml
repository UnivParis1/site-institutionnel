      subject: "Inscription confirmée-Séminaire DEM'ARTS"
      body: '<p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr">*English below<br>&nbsp;</p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr">Bonjour,</p><p class="p1">Ce mois de février, nous avons le plaisir de vous annoncer quatre événements.</p><p class="p1"><strong>Mardi 4 février</strong> : <strong>Séminaire DEM''ARTS avec Yuriko Saito</strong> (Professeur émérite de philosophie, Rhode Island School of Design, États-Unis), sur « L''art du Ménage : Promesses et défis de la technologie numérique »</p><p class="p2"><span class="s1">Information :</span><br><a href="https://demarts.pantheonsorbonne.fr/evenements/seminaire-transversal-demarts-quatrieme-seance"><span class="s1 s2">https://demarts.pantheonsorbonne.fr/evenements/seminaire-transversal-demarts-quatrieme-seance</span></a><span class="s1">&nbsp;</span></p><p style="line-height:1.2;margin-bottom:0pt;margin-top:0pt;" dir="ltr">&gt; Cette séance aura lieu en format hybride</p><p style="background-color:#ffffff;line-height:1.38;margin-bottom:0pt;margin-top:0pt;" dir="ltr">&gt;&gt; Pour ceux qui assisteront en ligne, voici le lien de diffusion en direct :&nbsp;<a style="text-decoration:none;" href="https://p1ps.cloud.panopto.eu/Panopto/Pages/Viewer.aspx?id=5482db7e-857b-498a-a9f0-b20500eaee7f">https://p1ps.cloud.panopto.eu/Panopto/Pages/Viewer.aspx?id=5482db7e-857b-498a-a9f0-b20500eaee7f</a>&nbsp;</p><p style="background-color:#ffffff;line-height:1.38;margin-bottom:0pt;margin-top:0pt;" dir="ltr">&gt;&gt; Pour ceux qui assisteront en présentiel, la séance se tiendra en Salle 6 du centre Panthéon au&nbsp;<a style="text-decoration:none;" href="https://maps.app.goo.gl/uE61b5gCdGicnWhu6">12 place du Panthéon 75005 Paris</a>, (Aile Soufflot, Escalier M, 2e étage, à droite). *Veuillez noter que pour les personnes extérieures à l’université Paris 1, une pièce d’identité sera demandée à l’entrée.</p><p class="p1"><strong>Jeudi 6 février</strong> : <strong>Présentation de l’ouvrage Restos, Rastros, Rostros, le dernier livre de l’artiste plasticien </strong><a href="https://www.eduardomedici.com.ar/"><span class="s1"><strong>Eduardo Médici</strong></span></a>, à la Bibliothèque de l’École des Arts de l’Université Paris 1 Panthéon-Sorbonne, située au&nbsp; <a href="https://g.co/kgs/mM4ecK9"><span class="s1">47 Rue des Bergers, 75015 Paris</span></a>.</p><p class="p1">Organisation : Miguel Almiron, Azadeh Nilchiani, Diane Watteau, Frank Pecquet</p><p class="p2"><span class="s2">Information : </span><a href="https://demarts.pantheonsorbonne.fr/actualite/presentation-louvrage-restos-rastros-rostros-deduardo-medici"><span class="s2 s3">https://demarts.pantheonsorbonne.fr/actualite/presentation-louvrage-restos-rastros-rostros-deduardo-medici</span></a><span class="s2"> &nbsp;</span></p><p class="p3">&nbsp;</p><p class="p1"><strong>Samedi 8 février</strong> : <strong>Symposium Esthétique du Care, Démocratie et Arts numériques</strong></p><p class="p1">Organisation : Barbara Formis</p><p class="p2"><span class="s2">Programme et information :</span><br><a href="https://demarts.pantheonsorbonne.fr/en/evenements/symposium-care-aesthetics-democracy-and-digital-arts"><span class="s2 s3">https://demarts.pantheonsorbonne.fr/en/evenements/symposium-care-aesthetics-democracy-and-digital-arts</span></a><span class="s2"> &nbsp;</span></p><p class="p3">&nbsp;</p><p class="p1"><strong>Pour rappel</strong> :&nbsp;</p><p class="p2"><span class="s2">L''appel à communications pour </span><a href="https://ontheimage.com/2025-conference"><span class="s2 s3">la seizième conférence internationale sur l''image</span></a><span class="s2">, co-organisée par le projet </span><a href="https://demarts.pantheonsorbonne.fr/demarts-creation-democratie-et-numerique"><span class="s2 s3">DEM’ARTS</span></a><span class="s2"> et </span><a href="https://ontheimage.com/"><span class="s2 s3">The Image Research Network de Common Ground</span></a><span class="s2">, est toujours ouvert. </span><a href="https://demarts.pantheonsorbonne.fr/actualite/lappel-communications-seizieme-conference-internationale-limage"><span class="s2 s3">https://demarts.pantheonsorbonne.fr/actualite/lappel-communications-seizieme-conference-internationale-limage</span></a><span class="s2">&nbsp;</span></p><p class="p1">Nous espérons que ces rendez-vous retiendront votre attention et que nous aurons le plaisir de vous y retrouver.</p><p class="p1">Bien cordialement,</p><p class="p1">Équipe projet DEM’ARTS</p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr">***</p><p class="p1">Hello,</p><p class="p1">This February, we''re pleased to announce four events.</p><p class="p1"><strong>Tuesday February</strong> <strong>4</strong>: <strong>DEM''ARTS Seminar with Yuriko Saito </strong>(Professor Emeritus of Philosophy, Rhode Island School of Design, USA), on “The Art of the Household: Promises and Challenges of Digital Technology”.</p><p class="p1">Information: <a href="https://demarts.pantheonsorbonne.fr/en/evenements/demarts-cross-disciplinary-seminar-fourth-session">https://demarts.pantheonsorbonne.fr/en/evenements/demarts-cross-disciplinary-seminar-fourth-session</a>&nbsp;</p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr">&gt; This session will be held in hybrid format</p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr">&gt;&gt; For those attending online, here is the live link: https:<a style="text-decoration:none;" href="https://p1ps.cloud.panopto.eu/Panopto/Pages/Viewer.aspx?id=5482db7e-857b-498a-a9f0-b20500eaee7f">&nbsp;</a><a style="text-decoration:none;" href="//p1ps.cloud.panopto.eu/Panopto/Pages/Viewer.aspx?id=5482db7e-857b-498a-a9f0-b20500eaee7f">//p1ps.cloud.panopto.eu/Panopto/Pages/Viewer.aspx?id=5482db7e-857b-498a-a9f0-b20500eaee7f</a>&nbsp;</p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr">&gt;&gt; For those attending in person, the session will be held in Salle 6 of the Panthéon center at<a style="text-decoration:none;" href="https://maps.app.goo.gl/uE61b5gCdGicnWhu6">&nbsp;12 place du Panthéon 75005 Paris</a>, (Aile Soufflot, Escalier M, 2nd floor, on the right).</p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr">*Please note that for people from outside Université Paris 1, identification will be required at the entrance.</p><p class="p1"><strong>Thursday February 6</strong>: <strong>Presentation of Restos, Rastros, Rostros, the latest book by artist </strong><a href="https://www.eduardomedici.com.ar/"><span class="s1"><strong>Eduardo Médici</strong></span></a>, at the Bibliothèque de l''École des Arts de l''Université Paris 1 Panthéon-Sorbonne, at <a href="https://g.co/kgs/mM4ecK9"><span class="s1">47 Rue des Bergers, 75015 Paris</span></a>.</p><p class="p1">Organizers: Miguel Almiron, Azadeh Nilchiani, Diane Watteau, Frank Pecquet</p><p class="p2"><span class="s2">Information:</span><a href="https://demarts.pantheonsorbonne.fr/actualite/presentation-louvrage-restos-rastros-rostros-deduardo-medici"><span class="s2 s3">https://demarts.pantheonsorbonne.fr/actualite/presentation-louvrage-restos-rastros-rostros-deduardo-medici</span></a>&nbsp;</p><p class="p1"><strong>Saturday February 8 : Symposium Aesthetics of Care, Democracy and Digital Arts</strong></p><p class="p1">Organized by Barbara Formis</p><p class="p1">Program and information:</p><p class="p2"><a href="https://demarts.pantheonsorbonne.fr/en/evenements/symposium-care-aesthetics-democracy-and-digital-arts"><span class="s3">https://demarts.pantheonsorbonne.fr/en/evenements/symposium-care-aesthetics-democracy-and-digital-arts</span></a></p><p class="p2"><span class="s2"><strong>A reminder: </strong>The call for papers for</span><a href="https://ontheimage.com/2025-conference"><span class="s2 s3"> the sixteenth international conference on the image</span></a><span class="s2">, co-organized by the </span><a href="https://demarts.pantheonsorbonne.fr/en"><span class="s2 s3">DEM''ARTS</span></a><span class="s2"> project and</span><a href="https://ontheimage.com/"><span class="s2 s3"> Common Ground''s</span></a><a href="https://demarts.pantheonsorbonne.fr/demarts-creation-democratie-et-numerique"><span class="s2 s3">DEM''ARTS</span></a><span class="s2"> and</span><a href="https://ontheimage.com/"><span class="s2 s3"> The Image Research Network</span></a><span class="s2">, is still open.</span></p><p class="p1">We look forward to seeing you at these events.</p><p class="p3">&nbsp;</p><p class="p1">Yours sincerely,</p><p class="p1">DEM''ARTS project team</p><p><br><a style="text-decoration:none;" href="https://demarts.pantheonsorbonne.fr/">https://demarts.pantheonsorbonne.fr/</a></p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr"><a style="text-decoration:none;" href="https://demarts.pantheonsorbonne.fr/en">https://demarts.pantheonsorbonne.fr/en</a></p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr">* Si vous souhaitez vous désinscrire de notre lettre d’information, veuillez envoyer un e-mail vide avec pour objet&nbsp;: unsubscribe demarts à&nbsp;<a style="text-decoration:none;" href="mailto:sympa@listes.univ-paris1.fr">sympa@listes.univ-paris1.fr</a></p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr">*&nbsp;If you wish to unsubscribe from our newsletter, please send an empty email with the subject&nbsp;: unsubscribe demarts to&nbsp;<a style="text-decoration:none;" href="mailto:sympa@listes.univ-paris1.fr">sympa@listes.univ-paris1.fr</a> &nbsp;</p>'
