      cc_mail: ''
      cc_options: {  }
      from_mail: contact.demarts@univ-paris1.fr
      from_options: {  }
      from_name: "Séminaire DEM'ARTS-Paris 1 Panthéon-Sorbonne"
      reply_to: ''
      return_path: ''
      sender_mail: ''
      sender_name: ''
      subject: "Inscription confirmée-Séminaire DEM'ARTS"
      body: '<p style="line-height:1.2;margin-bottom:0pt;margin-top:0pt;" dir="ltr"><span style="background-color:transparent;color:#000000;font-family:Cambria,serif;font-size:12pt;font-style:normal;font-variant:normal;text-decoration:none;vertical-align:baseline;white-space:pre-wrap;"><strong>*English below&nbsp;</strong></span></p><p>&nbsp;</p><p class="p1">Bonjour,</p><p class="p1">Nous vous remercions pour votre intérêt pour le séminaire <strong>DEM''ARTS : création, démocratie et numérique</strong>.</p><p class="p1">Nos deux prochains événements en avril seront :</p><ul class="ul1"><li class="li1"><strong>Journées d’étude « Nouvelles gestualités dissidentes »</strong><br>Un événement coorganisé avec l''École nationale supérieure d’art et de design de Limoges, les <strong>3 et 4 avril 2025</strong>.<br>Informations : <a href="https://www.ensad-limoges.fr/agenda/nouvelles-gestualites-dissidentes/"><span class="s2">ENSAD Limoges</span></a></li><li class="li1"><strong>DEM’ARTS International Workshop – Fact, Fiction and Post-Creation</strong><br>Organisé à <strong>La Maison Française de New York University</strong>, New York, le <strong>8 avril 2025</strong>.<br>Informations : <a href="https://as.nyu.edu/research-centers/maisonfrancaise/events/spring-2025/dem-arts-international-workshop-fact--fiction-and-post-creation.html"><span class="s2">NYU Maison Française</span></a></li></ul><p class="p1">Nous vous tiendrons également informé(e) des futurs événements du projet <strong>DEM''ARTS</strong>.</p><p class="p1">&gt; <strong>Veuillez noter qu''une seule inscription vous permettra de recevoir toutes les informations du projet.</strong></p><p class="p1">Cordialement,</p><p style="line-height:1.2;margin-bottom:0pt;margin-top:0pt;" dir="ltr"><span style="background-color:transparent;color:#000000;font-family:Cambria,serif;font-size:12pt;font-style:normal;font-variant:normal;font-weight:400;text-decoration:none;vertical-align:baseline;white-space:pre-wrap;">Équipe projet DEM''ARTS</span></p><p style="line-height:1.2;margin-bottom:0pt;margin-top:0pt;" dir="ltr"><a style="text-decoration:none;" href="https://demarts.pantheonsorbonne.fr/"><span style="-webkit-text-decoration-skip:none;background-color:transparent;color:#1155cc;font-family:Cambria,serif;font-size:12pt;font-style:normal;font-variant:normal;font-weight:400;text-decoration-skip-ink:none;vertical-align:baseline;white-space:pre-wrap;"><u>https://demarts.pantheonsorbonne.fr/</u></span></a><span style="background-color:transparent;color:#000000;font-family:Cambria,serif;font-size:12pt;font-style:normal;font-variant:normal;font-weight:400;text-decoration:none;vertical-align:baseline;white-space:pre-wrap;">&nbsp;</span></p><p>&nbsp;</p><p style="line-height:1.2;margin-bottom:0pt;margin-top:0pt;" dir="ltr"><span style="background-color:transparent;color:#000000;font-family:Cambria,serif;font-size:12pt;font-style:normal;font-variant:normal;font-weight:400;text-decoration:none;vertical-align:baseline;white-space:pre-wrap;">***</span></p><p style="line-height:1.2;margin-bottom:0pt;margin-top:0pt;" dir="ltr"><span style="background-color:transparent;color:#000000;font-family:Cambria,serif;font-size:12pt;font-style:normal;font-variant:normal;font-weight:400;text-decoration:none;vertical-align:baseline;white-space:pre-wrap;">Hi,</span></p><p style="line-height:1.2;margin-bottom:0pt;margin-top:0pt;" dir="ltr"><span style="background-color:transparent;color:#000000;font-family:Cambria,serif;font-size:12pt;font-style:normal;font-variant:normal;font-weight:400;text-decoration:none;vertical-align:baseline;white-space:pre-wrap;">Thank you for your interest in the</span><a style="text-decoration:none;" href="https://demarts.pantheonsorbonne.fr/"><span style="-webkit-text-decoration-skip:none;background-color:transparent;color:#1155cc;font-family:Cambria,serif;font-size:12pt;font-style:normal;font-variant:normal;font-weight:400;text-decoration-skip-ink:none;vertical-align:baseline;white-space:pre-wrap;"><u> DEM''ARTS</u></span></a><span style="background-color:transparent;color:#000000;font-family:Cambria,serif;font-size:12pt;font-style:normal;font-variant:normal;font-weight:400;text-decoration:none;vertical-align:baseline;white-space:pre-wrap;">: creation, democracy and digital media seminar.</span></p><p>Our upcoming events in April will be:</p><ul><li><p><strong>Study days “New dissident gestures”</strong></p><p>An event co-organized with the École nationale supérieure d''art et de design de Limoges, on <strong>April 3 and 4, 2025</strong>.</p></li><li>Information: <a href="https://www.ensad-limoges.fr/agenda/nouvelles-gestualites-dissidentes/">ENSAD Limoges</a><br>&nbsp;</li><li><p><strong>DEM''ARTS International Workshop – Fact, Fiction and Post-Creation</strong></p><p>Organized at <strong>La Maison Française of New York University</strong>, New York, on <strong>April 8, 2025</strong>.</p></li><li>Information: <a href="https://as.nyu.edu/research-centers/maisonfrancaise/events/spring-2025/dem-arts-international-workshop-fact--fiction-and-post-creation.html">NYU Maison Française</a></li></ul><p>We will also keep you informed of future events of the <strong>DEM''ARTS</strong> project.</p><p>&gt; <strong>Please note that a single registration will allow you to receive all the information about the project.</strong></p><p style="line-height:1.2;margin-bottom:0pt;margin-top:0pt;" dir="ltr">&nbsp;</p><p style="line-height:1.2;margin-bottom:0pt;margin-top:0pt;" dir="ltr">&nbsp;</p><p style="line-height:1.2;margin-bottom:0pt;margin-top:0pt;" dir="ltr"><span style="background-color:transparent;color:#000000;font-family:Cambria,serif;font-size:12pt;font-style:normal;font-variant:normal;font-weight:400;text-decoration:none;vertical-align:baseline;white-space:pre-wrap;">With kind regards,</span></p><p style="line-height:1.2;margin-bottom:0pt;margin-top:0pt;" dir="ltr"><span style="background-color:transparent;color:#000000;font-family:Cambria,serif;font-size:12pt;font-style:normal;font-variant:normal;font-weight:400;text-decoration:none;vertical-align:baseline;white-space:pre-wrap;">DEM''ARTS project team</span></p><p style="line-height:1.2;margin-bottom:0pt;margin-top:0pt;" dir="ltr"><a style="text-decoration:none;" href="https://demarts.pantheonsorbonne.fr/en"><span style="-webkit-text-decoration-skip:none;background-color:transparent;color:#1155cc;font-family:Cambria,serif;font-size:12pt;font-style:normal;font-variant:normal;font-weight:400;text-decoration-skip-ink:none;vertical-align:baseline;white-space:pre-wrap;"><u>https://demarts.pantheonsorbonne.fr/en</u></span></a></p><p>&nbsp;</p><p style="line-height:1.2;margin-bottom:0pt;margin-top:0pt;" dir="ltr"><span style="background-color:transparent;color:#000000;font-family:Cambria,serif;font-size:12pt;font-style:normal;font-variant:normal;font-weight:400;text-decoration:none;vertical-align:baseline;white-space:pre-wrap;">* Si vous souhaitez vous désinscrire de notre lettre d’information, veuillez envoyer un e-mail vide avec pour objet : unsubscribe demarts à sympa@listes.univ-paris1.fr</span></p><p style="line-height:1.2;margin-bottom:0pt;margin-top:0pt;" dir="ltr"><span style="background-color:transparent;color:#000000;font-family:Cambria,serif;font-size:12pt;font-style:normal;font-variant:normal;font-weight:400;text-decoration:none;vertical-align:baseline;white-space:pre-wrap;">* If you wish to unsubscribe from our newsletter, please send an empty email with the subject : unsubscribe demarts to sympa@listes.univ-paris1.fr&nbsp;&nbsp;</span></p>'
