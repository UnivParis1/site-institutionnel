  email_1:
    id: email
    handler_id: email_1
    label: 'Email au demandeur'
    notes: ''
    status: true
    conditions: {  }
    weight: 0
    settings:
      states:
        - completed
      to_mail: '[webform_submission:values:votre_email_your_email:raw]'
      to_options: {  }
