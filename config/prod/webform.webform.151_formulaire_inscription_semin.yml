      subject: "Inscription confirmée-Séminaire DEM'ARTS"
      body: "<p style=\"line-height:1.2;margin-bottom:0pt;margin-top:0pt;\" dir=\"ltr\"><span style=\"background-color:transparent;color:#000000;font-family:Cambria,serif;font-size:12pt;font-style:normal;font-variant:normal;text-decoration:none;vertical-align:baseline;white-space:pre-wrap;\"><strong>*English below&nbsp;</strong></span></p><p>Bonjour,<br>Nous vous remercions de votre intérêt pour le séminaire « DEM'ARTS : création, démocratie et numérique ».<br>C'est avec plaisir que nous vous annonçons le lancement de notre <strong>deuxième cycle de séminaire</strong>.\LLe programme détaillé de ce cycle vous sera communiqué prochainement.</p><ul><li><strong>Événement récent&nbsp;: la</strong><a href=\"https://demarts.pantheonsorbonne.fr/evenements/2-cycle-seminaire-transversal-demarts-seance-douverture\" data-entity-type=\"external\"><strong> séance d'ouverture de deuxième cycle de séminaire, intitulée « IA et transformations sensibles de la démocratie », le mardi 14 octobre 2025, la salle 6 du centre Panthéon.</strong></a><strong>&nbsp;</strong><br><strong>Intervenant·e·s : Miguel Almiron, Aurélie Herbet, Barbara Formis, Sandra Laugier, Azadeh Nilchiani et Camille Salinesi.</strong></li></ul><p><br>Nous vous tiendrons également informé.e.s des futurs événements du projet.<br>Votre inscription vous permettra de recevoir toutes les informations à venir.<br>&nbsp;</p><p>Cordialement,<br>L'équipe du projet DEM'ARTS</p><p style=\"line-height:1.2;margin-bottom:0pt;margin-top:0pt;\" dir=\"ltr\"><a style=\"text-decoration:none;\" href=\"https://demarts.pantheonsorbonne.fr/\"><span style=\"-webkit-text-decoration-skip:none;background-color:transparent;color:#1155cc;font-family:Cambria,serif;font-size:12pt;font-style:normal;font-variant:normal;font-weight:400;text-decoration-skip-ink:none;vertical-align:baseline;white-space:pre-wrap;\"><u>https://demarts.pantheonsorbonne.fr/</u></span></a><span style=\"background-color:transparent;color:#000000;font-family:Cambria,serif;font-size:12pt;font-style:normal;font-variant:normal;font-weight:400;text-decoration:none;vertical-align:baseline;white-space:pre-wrap;\">&nbsp;</span></p><p style=\"line-height:1.2;margin-bottom:0pt;margin-top:0pt;\" dir=\"ltr\">&nbsp;</p><p>&nbsp;</p><p style=\"line-height:1.2;margin-bottom:0pt;margin-top:0pt;\" dir=\"ltr\"><span style=\"background-color:transparent;color:#000000;font-family:Cambria,serif;font-size:12pt;font-style:normal;font-variant:normal;font-weight:400;text-decoration:none;vertical-align:baseline;white-space:pre-wrap;\">***</span></p><p>Hello,</p><p>Thank you for your interest in the seminar “DEM'ARTS: creation, democracy, and digital media.”</p><p>We are pleased to announce the launch of our <strong>second seminar series</strong>. The detailed program for this cycle will be communicated to you shortly.</p><ul><li><strong>Recent event : O</strong><a href=\"https://demarts.pantheonsorbonne.fr/en/evenements/2nd-cycle-demarts-cross-disciplinary-seminars-opening-session\" data-entity-type=\"external\"><strong>pening session of the second seminar cycle, entitled “AI and Sensitive Transformations of Democracy,” Tuesday, October 14, 2025, in Room 6 of the Panthéon Center</strong></a><strong>. Speakers: Miguel Almiron, Aurélie Herbet, Barbara Formis, Sandra Laugier, Azadeh Nilchiani, and Camille Salinesi.</strong></li></ul><p>We will also keep you informed of future events related to the project.</p><p>By registering, you will receive all the latest information.<br>&nbsp;</p><p><span style=\"background-color:transparent;color:#000000;font-family:Cambria,serif;font-size:12pt;font-style:normal;font-variant:normal;font-weight:400;text-decoration:none;vertical-align:baseline;white-space:pre-wrap;\">With kind regards,</span></p><p style=\"line-height:1.2;margin-bottom:0pt;margin-top:0pt;\" dir=\"ltr\"><span style=\"background-color:transparent;color:#000000;font-family:Cambria,serif;font-size:12pt;font-style:normal;font-variant:normal;font-weight:400;text-decoration:none;vertical-align:baseline;white-space:pre-wrap;\">DEM'ARTS project team</span></p><p style=\"line-height:1.2;margin-bottom:0pt;margin-top:0pt;\" dir=\"ltr\"><a style=\"text-decoration:none;\" href=\"https://demarts.pantheonsorbonne.fr/en\"><span style=\"-webkit-text-decoration-skip:none;background-color:transparent;color:#1155cc;font-family:Cambria,serif;font-size:12pt;font-style:normal;font-variant:normal;font-weight:400;text-decoration-skip-ink:none;vertical-align:baseline;white-space:pre-wrap;\"><u>https://demarts.pantheonsorbonne.fr/en</u></span></a></p><p>&nbsp;</p><p style=\"line-height:1.2;margin-bottom:0pt;margin-top:0pt;\" dir=\"ltr\"><span style=\"background-color:transparent;color:#000000;font-family:Cambria,serif;font-size:12pt;font-style:normal;font-variant:normal;font-weight:400;text-decoration:none;vertical-align:baseline;white-space:pre-wrap;\">* Si vous souhaitez vous désinscrire de notre lettre d’information, veuillez envoyer un e-mail vide avec pour objet : unsubscribe demarts à sympa@listes.univ-paris1.fr</span></p><p style=\"line-height:1.2;margin-bottom:0pt;margin-top:0pt;\" dir=\"ltr\"><span style=\"background-color:transparent;color:#000000;font-family:Cambria,serif;font-size:12pt;font-style:normal;font-variant:normal;font-weight:400;text-decoration:none;vertical-align:baseline;white-space:pre-wrap;\">* If you wish to unsubscribe from our newsletter, please send an empty email with the subject : unsubscribe demarts to sympa@listes.univ-paris1.fr&nbsp;&nbsp;</span></p>"
