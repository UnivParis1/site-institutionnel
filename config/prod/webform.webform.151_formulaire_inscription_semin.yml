      from_mail: contact.demarts@univ-paris1.fr
      from_options: {  }
      from_name: "Séminaire DEM'ARTS-Paris 1 Panthéon-Sorbonne"
      reply_to: ''
      return_path: ''
      sender_mail: ''
      sender_name: ''
      subject: "Inscription confirmée-Séminaire DEM'ARTS"
      body: '<p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr">*English below<br>&nbsp;</p><p style="line-height:1.2;margin-bottom:0pt;margin-top:0pt;" dir="ltr">Bonjour,</p><p style="line-height:1.2;margin-bottom:0pt;margin-top:0pt;" dir="ltr">Nous vous remercions pour votre intérêt pour le séminaire<a style="text-decoration:none;" href="https://demarts.pantheonsorbonne.fr/"> DEM''ARTS</a> : création, démocratie et numérique.<br>Notre prochaine séance du séminaire, intitulée : « L''art du ménage : promesses et défis de la technologie numérique » aura lieu le 4 février 2025 (18 h - 20 h),</p><p style="line-height:1.2;margin-bottom:0pt;margin-top:0pt;" dir="ltr">avec <strong>Yuriko Saito</strong>, professeure émérite de philosophie à la Rhode Island School of Design, États-Unis.</p><p style="line-height:1.2;margin-bottom:0pt;margin-top:0pt;" dir="ltr">&nbsp;</p><p style="line-height:1.2;margin-bottom:0pt;margin-top:0pt;" dir="ltr">&gt; Cette séance aura lieu en format hybride</p><p style="background-color:#ffffff;line-height:1.38;margin-bottom:0pt;margin-top:0pt;" dir="ltr">&gt;&gt; Pour ceux qui assisteront en ligne, voici le lien de diffusion en direct :&nbsp;<a style="text-decoration:none;" href="https://p1ps.cloud.panopto.eu/Panopto/Pages/Viewer.aspx?id=5482db7e-857b-498a-a9f0-b20500eaee7f">https://p1ps.cloud.panopto.eu/Panopto/Pages/Viewer.aspx?id=5482db7e-857b-498a-a9f0-b20500eaee7f</a>&nbsp;</p><p style="background-color:#ffffff;line-height:1.38;margin-bottom:0pt;margin-top:0pt;" dir="ltr">&gt;&gt; Pour ceux qui assisteront en présentiel, la séance se tiendra en Salle 6 du centre Panthéon au&nbsp;<a style="text-decoration:none;" href="https://maps.app.goo.gl/uE61b5gCdGicnWhu6">12 place du Panthéon 75005 Paris</a>, (Aile Soufflot, Escalier M, 2e étage, à droite).</p><p style="background-color:#ffffff;line-height:1.38;margin-bottom:0pt;margin-top:0pt;" dir="ltr"><br>*Veuillez noter que pour les personnes extérieures à l’université Paris 1, une pièce d’identité sera demandée à l’entrée.</p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr"><br>&gt; Vous recevrez&nbsp;un rappel de la séance ainsi que&nbsp;le lien 2 jours avant la date prévue.</p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr"><br>&gt; Nous vous tiendrons également informé des futurs événements du projet DEM''ARTS.</p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr">Veuillez noter qu''une seule inscription vous permettra de recevoir toutes les informations et d''accéder à l''ensemble des séances du séminaire ; il n''est pas nécessaire de se réinscrire pour chaque séance.</p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr">***</p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr">Hi,</p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr">Thank you for your interest in the<a style="text-decoration:none;" href="https://demarts.pantheonsorbonne.fr/">&nbsp;DEM''ARTS</a> seminar: creation, democracy and digital media.</p><p style="line-height:1.2;margin-bottom:0pt;margin-top:0pt;" dir="ltr">Our next seminar session, entitled “The Art of Housework: Promises and Challenges of Digital Technology” will take place on February 4, 2025 (6 pm - 8 pm),</p><p style="line-height:1.2;margin-bottom:0pt;margin-top:0pt;" dir="ltr">with&nbsp;<strong>Yuriko Saito</strong>, Professor Emerita of Philosophy at the Rhode Island School of Design, USA.</p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr">&gt; This session will be held in hybrid format</p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr">&gt;&gt; For those attending online, here is the live link: https:<a style="text-decoration:none;" href="https://p1ps.cloud.panopto.eu/Panopto/Pages/Viewer.aspx?id=5482db7e-857b-498a-a9f0-b20500eaee7f">&nbsp;//p1ps.cloud.panopto.eu/Panopto/Pages/Viewer.aspx?id=5482db7e-857b-498a-a9f0-b20500eaee7f</a></p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr">&gt;&gt; For those attending in person, the session will be held in Salle 6 of the Panthéon center at<a style="text-decoration:none;" href="https://maps.app.goo.gl/uE61b5gCdGicnWhu6">&nbsp;12 place du Panthéon 75005 Paris</a>, (Aile Soufflot, Escalier M, 2nd floor, on the right).</p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr">*Please note that for people from outside Université Paris 1, identification will be required at the entrance.</p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr">&gt; You will receive&nbsp;a reminder of the session and&nbsp;the link 2 days before the scheduled date.</p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr">&gt; We''ll also keep you informed of future DEM''ARTS events.</p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr">Please note that a single registration will enable you to receive all the information and access all the seminar sessions; it is not necessary to re-register for each session.</p><p>&nbsp;</p><p>Équipe projet DEM''ARTS<br><a style="text-decoration:none;" href="https://demarts.pantheonsorbonne.fr/">https://demarts.pantheonsorbonne.fr/</a></p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr"><a style="text-decoration:none;" href="https://demarts.pantheonsorbonne.fr/en">https://demarts.pantheonsorbonne.fr/en</a></p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr">* Si vous souhaitez vous désinscrire de notre lettre d’information, veuillez envoyer un e-mail vide avec pour objet&nbsp;: unsubscribe demarts à&nbsp;<a style="text-decoration:none;" href="mailto:sympa@listes.univ-paris1.fr">sympa@listes.univ-paris1.fr</a></p><p style="line-height:1.2;margin-bottom:12pt;margin-top:12pt;" dir="ltr">*&nbsp;If you wish to unsubscribe from our newsletter, please send an empty email with the subject&nbsp;: unsubscribe demarts to&nbsp;<a style="text-decoration:none;" href="mailto:sympa@listes.univ-paris1.fr">sympa@listes.univ-paris1.fr</a> &nbsp;</p>'
