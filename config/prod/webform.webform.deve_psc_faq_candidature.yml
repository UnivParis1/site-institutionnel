  '04_202':
    '#type': item
    '#title': 'Calendrier des candidatures'
    '#description': '<p>Je peux trouver ces informations sur les différentes applications de candidature (je peux accéder directement au site en cliquant sur celui qui me concerne dans la liste ci-dessous) :</p><ul><li data-list-item-id="eb98a7082fa12e356163979dafba93a48"><a href="https://www.parcoursup.gouv.fr/calendrier" target="_blank" rel="noreferrer noopener"><strong>PACOURSUP</strong></a>&nbsp;(candidatures en première année de Licence)<br>&nbsp;</li><li data-list-item-id="e4337efe102c3f8dba32743557a94336a"><a href="https://ecandidat.univ-paris1.fr/ecandidat/#!offreFormationView" target="_blank" rel="noreferrer noopener"><strong>ECANDIDAT</strong></a>&nbsp;(candidatures en L2, L3, M2, DU, auditeur libre...)<br>&nbsp;</li><li data-list-item-id="e70415bc85a1b21ddb5ec6e5f4e959dea"><a href="https://information.monmaster.gouv.fr/calendrier/"><strong>MONMASTER</strong></a>&nbsp;(candidatures en première année de Master)<br>&nbsp;</li><li data-list-item-id="eb3801e15e8f56546fe94fb2eba309f1e"><a href="https://www.campusfrance.org/fr/candidature-procedure-etudes-en-france"><strong>ETUDES EN FRANCE</strong></a>&nbsp;(étudiants internationaux)<br>&nbsp;</li><li data-list-item-id="ea5fbc57f34cf51a4be30a4d2fd014303"><a href="http://www.adum.fr" target="_blank" rel="noreferrer noopener"><strong>ADUM</strong>&nbsp;</a>(candidatures en doctorat)</li></ul><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="eeb1bc9934e71dbd6abda2139ab3a5191"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e6589fcb03465daa50663e4a841a30e4b"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
    '#states':
      visible-slide:
        ':input[name="candidature"]':
          value: 'Calendrier candidatures'
    '#wrapper_attributes':
      class:
        - faqtextreponse
  '04_201':
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="candidature"]':
          value: 'Savoir comment candidater'
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p><span class="ui-dialog-title" id="ui-id-92"><strong>Je suis étudiant international ?</strong></span><br><span class="ui-dialog-title" id="ui-id-92">Je peux trouver les informations dans la rubrique <strong>2. "Suivre la bonne procédure de candidature" </strong>du lien suivant :</span></p><p><a href=" https://international.pantheonsorbonne.fr/venir-paris-1-pantheon-sorbonne/etudiant-en-mobilite-individuelle ">https://international.pantheonsorbonne.fr/venir-paris-1-pantheon-sorbonne/etudiant-en-mobilite-individuelle</a></p><p><strong>Je souhaite me réorienter</strong><br>Pour obtenir des informations ou candidater pour une <strong>réorientation</strong>, je peux me rendre sur le lien suivant : <a class="moz-txt-link-freetext" href="https://www.pantheonsorbonne.fr/inscription/reorientation" moz-do-not-send="true">https://www.pantheonsorbonne.fr/inscription/reorientation</a> , à condition d''être bien inscrit pour l''année en cours dans l''enseignement supérieur français.&nbsp;</p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="edf92bad308725f1b144c47e0d2b4144c"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e97390cc7ff8e783a0cc9744dfdd7213d"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  informations_formation_continue:
    '#type': radios
    '#title': 'Je peux trouver les informations concernant la formation continue sur le site web https://formation-continue.pantheonsorbonne.fr/'
    '#options':
      "J'ai trouvé réponse à ma question ": 'J''ai trouvé réponse à ma question  -- <a href="https://formation-continue.pantheonsorbonne.fr/">https://formation-continue.pantheonsorbonne.fr/ </a>'
      'Je souhaite en savoir plus sur les différences entre une VAE et une VAPP ': 'Je souhaite en savoir plus sur les différences entre une VAE et une VAPP '
    '#states':
      visible-slide:
        ':input[name="candidature"]':
          value: 'Candidatures fCPS'
    '#options__properties': ''
  vae_vapp:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="informations_formation_continue"]':
          value: 'Je souhaite en savoir plus sur les différences entre une VAE et une VAPP '
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>La <strong>VAE </strong>(Validation des acquis de l''expérience) permet de valoriser une expérience personnelle et/ou professionnelle par un diplôme du même domaine. Pour l''obtenir il faut soumettre un dossier et le soutenir à l''oral devant un jury (pas besoin de suivre des cours, sauf en cas de VAE partielle).&nbsp;<br>En savoir plus sur la VAE <a href="https://formation-continue.pantheonsorbonne.fr/valider-ses-acquis/valider-ses-acquis-de-lexperience-vae" target="_blank" rel="noreferrer noopener"><strong>: https://formation-continue.pantheonsorbonne.fr/valider-ses-acquis/valider-ses-acquis-de-lexperience-vae</strong></a>.&nbsp;</p><p>La <strong>VAPP </strong>(Validation&nbsp;acquis personnels et professionnels) permet d''entrer à l''université à un certain niveau d''études, sans autre prérequis que sa propre expérience professionnelle et/ou personnelle (cela implique de suivre des cours, le plus souvent en <a href="https://formation-continue.pantheonsorbonne.fr/reprendre-ses-etudes-luniversite-paris-1"><strong>Reprise d''études</strong></a>, afin d''obtenir le diplôme du même domaine d''activité).&nbsp;<br>En savoir plus sur la VAPP <a href="https://formation-continue.pantheonsorbonne.fr/valider-ses-acquis/valider-ses-acquis-personnels-et-professionnels-vapp" target="_blank" rel="noreferrer noopener"><strong>: https://formation-continue.pantheonsorbonne.fr/valider-ses-acquis/valider-ses-acquis-personnels-et-professionnels-vapp</strong></a></p><p>Attention : des tarifs spécifiques s''appliquent en formation continue.</p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="ea0b59ff213d18d3a59e3dd931b91bb0b"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e068015ca836cf7314113dc436d44f76b"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  retour_page_accueil:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="informations_formation_continue"]':
          value: "J'ai trouvé réponse à ma question "
    '#wrapper_attributes':
