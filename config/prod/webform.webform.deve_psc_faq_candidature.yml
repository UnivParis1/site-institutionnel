      class:
        - faqtextreponse
    '#markup': '<p>Le nombre de candidatures est limité au sein d''un même département pédagogique.&nbsp;</p><p>Pour connaître le nombre de candidatures possibles en cas d''hésitation, il faut contacter le <a href="https://www.pantheonsorbonne.fr/formation/departements" target="_blank" rel="noreferrer noopener">département </a>concerné.&nbsp;</p><p>Si le nombre de vœux n''est pas connu, mieux vaut alors les formuler dans l''ordre de préférence.</p><p><strong>ATTENTION</strong> : &nbsp;<em>Une fois votre candidature enregistrée,<strong>&nbsp;il n''est plus possible de la supprimer.</strong></em><br><em>Elle sera comptabilisée dans le nombre de vœux, que vous l''ayez ou non finalisée. <strong>Cette action est donc irréversible</strong></em>, <em>veillez donc à NE PAS faire trop de demandes. Limitez les demandes au strict minimum possible.</em></p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e77de31708cb7533e05cfc63b8d17543c"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e600f32c72cd0adb6f95d80dee6a4f664"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  pb_reconnexion:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="sur_ecandidat"]':
          value: "Je n'arrive pas à me reconnecter sur mon compte e-candidat que j'ai déjà créé et activé "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Afin de me reconnecter sur mon compte e-candidat déjà créé et activé, je dois inscrire mon login (n° d''utilisateur) et mon mot de passe dans la partie qui se trouve comme sur la capture d''écran ci-dessous :&nbsp;</p><p>&nbsp;<a class="moz-txt-link-freetext" href="https://ecandidat.univ-paris1.fr" target="_blank" rel="noreferrer noopener">https://ecandidat.univ-paris1.fr</a></p><img src="/sites/default/files/inline-images/Champ%20utilisateur%20EC.png" data-entity-uuid="14fc38b0-3d48-4aef-9bf0-b0b05603eac1" data-entity-type="file" alt="Je ne suis pas étudiant à l&apos;université Paris 1 Panthéon-Sorbonne, veuillez vous connecter avec votre compte eCandidat, Champ Utilisateur, Champ Mot de passe, Bouton Connexion" width="619" height="338"><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e440c6f3760696f177fefce99778f88fa"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e0496a93f861a446e5d6850d1ef9585f0"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  reponse_ine_ps:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="sur_parcoursup"]':
          value: 'On me demande mon numéro INE ou INES. Où puis-je le trouver ? '
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Je peux <strong>retrouver ce numéro sur mon relevé de note du baccalauréat français</strong>, ou sur un relevé de notes de l''enseignement supérieur français (si j''étais précédemment en université, Grande Ecole, etc.)</p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="eaad42fb8a5fdbb16a2fe9405925c4744"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e9f60700cb15a2c8c93f3da03a64f1576"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  contact_parcoursup:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="sur_parcoursup"]':
          value: "J'ai des soucis d'accessibilité avec cette plateforme"
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Je peux alerter directement Parcoursup :</p><ul><li data-list-item-id="ea9f1b1d2e75d1c11d7f658045f01ae2f">via un <a href="https://dossier.parcoursup.fr/Candidat/contact?ACTION=4">formulaire dédié</a></li><li data-list-item-id="ebeb505f80019abc0b3a28f311ead17fb">par téléphone, au numéro vert : <strong>0 800 400 070, </strong>du lundi au vendredi de 10h à 16h, ou sur <a href="https://app.acce-o.fr/client/parcoursup"><strong>acceo</strong></a> pour les personnes malentendantes</li></ul><hr><p>Si j''ai d''autres questions concernant un autre domaine, <a href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/"><strong>je peux revenir à l''accueil de la foire aux questions</strong></a></p>'
  reponse_ine_ec:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="sur_ecandidat"]':
          value: 'On me demande mon numéro INE ou INES. Où puis-je le trouver ? '
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Je peux <strong>retrouver ce numéro sur mon relevé de note du baccalauréat français</strong>, ou sur un relevé de notes de l''enseignement supérieur français (si j''étais précédemment en université, Grande Ecole, etc.)</p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e1add4d60d0728eea74055508724ce753"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="ee5579bf76fd9734e939882d355bf14d1"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  reponse_ine_mm:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="sur_monmaster"]':
          value: 'On me demande mon numéro INE ou INES. Où puis-je le trouver ? '
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Je peux <strong>retrouver ce numéro sur mon relevé de note du baccalauréat français</strong>, ou sur un relevé de notes de l''enseignement supérieur français (si j''étais précédemment en université, Grande Ecole, etc.)</p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e8381dd954d4310cbd208086236cb738c"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e598dc5f629b29a261a4246fe1fb842d6"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  contact_monmaster:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="sur_monmaster"]':
          value: "J'ai des soucis d'accessibilité avec cette plateforme"
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Je peux alerter directement MonMaster :</p><ul><li data-list-item-id="ef9afd40fd84289c706426b3e87cc4ad1">via <a href="https://monmaster.gouv.fr/contact/">le formulaire de contact</a>.</li><li data-list-item-id="e67b2bbcb3406f7dfe20894b6c31ae857">par téléphone, au numéro vert, au <strong>0800 002 001</strong>, ou via <a href="https://app.acce-o.fr/client/mon-master"><strong>acceo</strong></a>, si je suis malentendant, du lundi au vendredi, de 10 h à 12&nbsp;h&nbsp;30 et de 13&nbsp;h&nbsp;30 à 17 h.</li></ul><hr><p>Si j''ai d''autres questions concernant un autre domaine, <a href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/"><strong>je peux revenir à l''accueil de la foire aux questions</strong></a></p>'
  demarche_dri:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="sur_etudes_en_france_campus_france"]':
          value: "J'ai reçu reçu un accord préalable d'inscription. Que dois-je faire ? "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Je dois <strong>entreprendre les démarches pour l''obtention du visa</strong> puis me rapprocher de la <a href="https://international.pantheonsorbonne.fr/la-direction-relations-internationales" target="_blank" rel="noreferrer noopener">Direction des Relations Internationales (DRI) </a>pour obtenir l''autorisation d''inscription.</p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e6b2300611d6cee33be14b6339cf95d9f"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e4477cfbd0b8aec434530d6db6079c731"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  contact_dri:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="sur_etudes_en_france_campus_france"]':
          value: 'Quel service puis-je contacter pour mes questions de mobilité ?'
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Je peux contacter la <a href="https://international.pantheonsorbonne.fr/la-direction-relations-internationales" target="_blank" rel="noreferrer noopener">Direction des Relations internationales (DRI)</a>.</p><p>Maison internationale (58 boulevard Arago, 75013 Paris) sans rendez-vous aux horaires suivants :</p><ul><li data-list-item-id="e0206b23b4caa33d7334b726dbaba33ae"><strong>Lundi&nbsp;</strong>:&nbsp;14h00-16h30</li><li data-list-item-id="e8ad0c1a8caeeed0903fe7a56f12b861a"><strong>Mardi </strong>:&nbsp;14h00-16h30</li><li data-list-item-id="e5bf01b718d34b33357927b98e0a1e084"><strong>Mercredi </strong>:&nbsp;9h30-12h30</li><li data-list-item-id="e657a74cda5393d0e21eee1b21316a0f3"><strong>Jeudi </strong>:&nbsp;9h30-12h30 / 14h00-16h30</li></ul><p>Pour les contacter par téléphone ou par mail : <a href="https://international.pantheonsorbonne.fr/la-direction-relations-internationales">https://international.pantheonsorbonne.fr/la-direction-relations-internationales</a></p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="ebb518cdfb2632901982498b70f42d8a5"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="ea1bca9ba5706b073a7515c39d6309396"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
