    '#description': '<p><strong>Pour consulter l''offre de formations à Paris 1 Panthéon-Sorbonne</strong>, rendez-vous ici : <a href="https://formations.pantheonsorbonne.fr"><strong>https://formations.pantheonsorbonne.fr</strong></a></p>'
