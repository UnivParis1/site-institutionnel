  candidature:
    '#type': radios
    '#title': 'Je souhaite candidater'
    '#description': "<p>Veuillez choisir la thématique qui se rapproche le plus de votre cas concernant les candidatures à l'université Paris 1 Panthéon-Sorbonne.&nbsp;</p>"
    '#title_display': invisible
