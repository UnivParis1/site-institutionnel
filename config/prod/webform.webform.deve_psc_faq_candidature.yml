        - faqtextreponse
    '#markup': '<p><a href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/"><strong>Retour à l''accueil de la foire aux questions</strong></a></p>'
  plateformes:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="candidature"]':
          value: 'Candidature spontanée'
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Il n''est pas possible de faire de candidature spontanée. Je dois obligatoirement passer par une plateforme officielle, (en fonction de ma situation) :</p><ul><li data-list-item-id="ee135391735f49b609e49ab5bd28e3f7b"><a href="https://www.parcoursup.gouv.fr/calendrier" target="_blank" rel="noreferrer noopener"><strong>PARCOURSUP</strong></a> <span class="description">(candidatures en première année de Licence)</span></li><li data-list-item-id="ed71b0e699d06d87ab7f235ed9db65d9e"><a href="https://ecandidat.univ-paris1.fr/ecandidat/#!offreFormationView" target="_blank" rel="noreferrer noopener"><strong>ECANDIDAT</strong></a> <span class="description">(candidatures en L2, L3, M2, DU, auditeur libre, VAPP.)</span></li><li data-list-item-id="e2abb6d4acb2d292edfe0abdc68be6337"><a href="https://information.monmaster.gouv.fr/calendrier/"><strong>MONMASTER</strong></a> <span class="description">(candidatures en première année de Master)</span></li><li data-list-item-id="e68ec143f38a3e5ed103c2f7f5bdeb978"><a href="https://www.campusfrance.org/fr/candidature-procedure-etudes-en-france"><strong>ETUDES EN FRANCE</strong></a> <span class="description">(étudiants internationaux)</span></li><li data-list-item-id="e0f48001e50c49555691bd3b68dcb0e0b"><a href="https://adum.fr/"><strong>ADUM</strong></a> <span class="description">(candidatures en doctorat)</span></li></ul><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e7343575dd18b8976832b21c68a7881e9"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e888ab597b088af039871a7762883b524"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  passanneesup:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="candidature"]':
          value: 'Passage n1'
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Si j''ai achevé ma licence 1ère année (L1) ou ma licence 2e année (L2) avec un semestre non compensable et à partir d’une moyenne de 8 sur 20 à ce semestre, je peux demander au président ou à la présidente du jury son passage conditionnel en 2<sup>è</sup> ou 3<sup>è</sup> année (= <strong>AJ</strong>ourné <strong>A</strong>utorisé à <strong>C</strong>ontinuer dit aussi <strong>AJAC</strong>).</p><p><strong>Pour un passage conditionnel en L2</strong>, les deux conditions suivantes sont cumulatives :</p><ul><li data-list-item-id="ee18a585a506cba1eb233f984be162e93">Avoir validé un semestre en L1</li><li data-list-item-id="e49aafe91ec3370b7a9467794267c8887">Avoir obtenu une moyenne minimum de 8 sur 20 au semestre de première année non validé<br>-&gt; Je m''inscris uniquement en L2.</li></ul><p>&nbsp;</p><p><strong>Pour un passage conditionnel en L3</strong>, les trois conditions suivantes sont cumulatives :</p><ul><li data-list-item-id="efe9e2d653895942b9a36e487ee16710e">Avoir validé la L1</li><li data-list-item-id="ea9603c768dc1ebf4c5f8f96099bc4b65">Avoir validé un semestre en L2</li><li data-list-item-id="ea862f2fb26f0e862ad6471c9d5979293">Avoir obtenu une moyenne minimum de 8 sur 20 au semestre de L2 non validé<br>-&gt; Je m''inscris en L2 et en L3.</li></ul><p><strong>Attention </strong>: au moment de l''inscription, vous devrez d''abord vous inscrire en L3 pour ne payer que ce niveau, puis obligatoirement refaire une inscription en L2 sans payer (optez alors pour le "<strong>paiement par chèque</strong>" et <a href="mailto:inscriptions-administratives@univ-paris1.fr?subject=Inscription%20en%20AJAC%20L2-L3%20%C3%A0%20vous%20signaler&amp;body=N%C2%B0%20%C3%A9tudiant%20%3A%20">contactez-nous</a> pour finaliser votre inscription en AJAC).</p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e629a159030cbb58be786d9de59457dcc"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e895a9ba78a29db0bf26277b3a6a88fbe"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
