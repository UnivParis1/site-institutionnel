  adum:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="j_ai_un_probleme_depuis_la_plateforme_suivante"]':
          value: ADUM
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>&nbsp;</p><p>En cas de problème sur la plateforme ADUM, il faut solliciter de l''aide auprès de votre <a href="https://recherche.pantheonsorbonne.fr/doctorat-hdr/dix-ecoles-doctorales"><strong>Ecole Doctorale</strong></a>.&nbsp;</p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="ec1740ff7f487bb525aba7d880da4d244"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="eea105e3f5d1be498227f80f5c6a0d06e"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  pb_connexion_ec:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="sur_ecandidat"]':
          value: "Je n'arrive pas à activer mon compte ECandidat ou je ne retrouve pas mes identifiants d'accès. "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Je dois bien vérifier à l''aide de la <a href="https://ecandidat.univ-paris1.fr/ecandidat/connect#!assistanceView"><strong>FAQ d''ECandidat</strong></a> que j''ai bien suivi toutes les étapes de la création de compte.</p><img src="/sites/default/files/inline-images/FAQ-EC.png" data-entity-uuid="f834e718-373e-488d-b788-396fd3dd3e6e" data-entity-type="file" alt="Consulter la FAQ est le première entrée dans le menu Assistance" width="600" height="250"><p>Je vérifie dans ma boîte mail que le courrier envoyé par ECandidat (de type "no-reply") avec mon identifiant n''est pas tombé dans mes Spams (indésirables, Pourriel, etc.). Surtout<strong> je ne supprime pas</strong> ce mail, afin de pouvoir retrouver mon identifiant avec son lien d''activation, le cas échéant.</p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e52b173f0eff3f5dd22e165b6eb69252f"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="ead123d8ba31e5222d22e282138cb2d30"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  impossible_de_choisir_une_formation:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="sur_ecandidat"]':
          value: "Je suis étudiant à Paris 1 Panthéon Sorbonne et je n'arrive pas à cliquer sur une formation à laquelle je souhaite candidater "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>&nbsp;</p><p>Je dois bien vérifier à l''aide de la <a href="https://ecandidat.univ-paris1.fr/ecandidat/connect#!assistanceView"><strong>FAQ d''ECandidat</strong></a> que j''ai bien suivi toutes les étapes de la création de compte,</p><img src="/sites/default/files/inline-images/FAQ-EC.png" data-entity-uuid="f9528849-db7a-4881-a5c4-be85cdfbdfbf" data-entity-type="file" width="602" height="250"><p><br>(comme par exemple bien remplir les 3 premières rubriques, jusqu''à "<strong>Baccalauréat</strong>").<br><img data-entity-uuid="33eea4b7-1d26-4217-96af-92e98a81294c" data-entity-type="file" src="/sites/default/files/inline-images/3%20rubriques.jpg" width="214" height="84" alt="Informations perso., Adresse, Baccalauréat"></p><p>Je dois ensuite descendre jusqu''à la rubrique "<strong>Candidature</strong>" (et <strong>non </strong>"<s>Offre de formation</s>" qui sert seulement à vérifier les dates d''ouvertures et fermetures des candidatures).</p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e8d222f45ed048afbf728ab57e8283e3b"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="eca60c060ab3c83e3343a40dea8f8b38f"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
