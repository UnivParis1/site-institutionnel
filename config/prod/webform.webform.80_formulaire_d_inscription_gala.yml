id: 80_formulaire_d_inscription_gala
title: "80 - Formulaire d'inscription gala Master Transport internationaux"
description: "<p>Formulaire d'inscription pour le gala Master Transport internationaux 2025</p>"
categories: {  }
elements: |-
  field2:
    '#type': textfield
    '#title': 'Votre prénom :'
    '#placeholder': Jean
    '#autocomplete': given-name
    '#required': true
    '#required_error': "Merci d'indiquer votre prénom"
  field1:
    '#type': textfield
    '#title': 'Votre nom :'
    '#placeholder': Dupont
    '#autocomplete': family-name
    '#required': true
    '#required_error': 'Merci de renseigner votre nom'
  mail:
    '#type': email
    '#title': 'Votre adresse courriel'
    '#description': "<p>Indiquez une adresse de messagerie valide car c'est avec celle-ci que nous vous contacterons et c'est sur celle-ci que vous recevrez votre ticket de paiement.</p>"
    '#placeholder': jeandupont@monfai.com
    '#autocomplete': email
    '#required': true
    '#required_error': "Merci d'indiquer votre courriel"
  terms_of_service:
    '#type': webform_terms_of_service
    '#title': "J'accepte les {Conditions générales de vente}"
    '#help_title': 'Cliquez sur Conditions génrérales de vente pour les parcourir.'
    '#help_display': title_before
    '#required': true
    '#required_error': 'Vous devez accepter les conditions pour valider ce formulaire'
    '#return_value': "J'accepte les CGV"
    '#terms_title': CGV
    '#terms_content': "<h3>Tarifs :</h3><ul><li>Prestation Prix unitaire (TTC)</li><li>Participation au Gala (tarif public) 30 euros</li><li>Participation au Gala (tarif étudiant) 15 euros</li><li>Annuaire : 20 euros</li><li>Livre : 30 euros</li><li>Sponsoring v1 900 euros</li><li>Sponsoring v2 2500 euros</li><li>Participation soutien 150 euros</li></ul><p>Ces frais ne couvrent pas les frais de déplacement.</p><p><strong>Votre inscription est à régler avant le 11/10/2025 par carte bancaire ou par virement bancaire.</strong></p><h3>Méthode de paiement :</h3><p>Par carte bancaire(CB) ou par virement bancaire. Le mode de paiement par CB est le plus rapide, la sécurité assurée par 3D secure se révèle une fonctionnalité permettant de sécuriser la transaction mais réclament la double authentification. Il faut aussi s'assurer que le plafond de paiement autorisé par la banque est suffisamment élevé.<br>Concernant le virement, ce mode de paiement est moins rapide. Attention il nécessite de remplir le champ «nom du donneur d'ordre» qui peut-être différent de celui de la personne désirant s'inscrire.</p><h3>Conditions d'inscription :</h3><p>L’Université Paris 1 Panthéon-Sorbonne se réserve le droit de facturer les frais bancaires qui pourraient être liés à l’encaissement des droits d’inscription.<br>Assurez-vous d'inclure TOUTES LES OPÉRATIONS DE BANQUE ET LES HONORAIRES DE TRANSACTION en réalisant vos paiements par virement bancaire. Tous les honoraires de transfert sont la responsabilité de la personne faisant le paiement et ne seront pas couverts par l'Université. Avant la mise en place du virement, vous devriez contacter votre banque pour connaître le montant exact de cette opération, afin de l'ajouter au montant que vous devez régler à Paris 1. Notez que les paiements faits par virements internationaux peuvent prendre à 4 semaines à être confirmé par l'Université. Prenez ceci en compte en prévoyant vos paiements.<br>Si vous rencontrez des difficultés à faire des paiements par carte bancaire, contactez votre banque ou le détenteur de carte de crédit et indiquer leur, les détails du paiement que vous avez cherché à réaliser. Le problème vient souvent d'un plafond de paiement maximal imputé à cette carte, dans ce cas, vous pouvez demander à votre banque, d'augmenter celui-ci. Le problème peut aussi venir du fait que vous payez depuis l'étranger sur Internet. Une fois que vous aurez contacté votre banque, le problème devrait être résolu et vous pourrez faire le paiement le jour ouvrable suivant. Les paiements faits par la carte de crédit sont immédiatement confirmés.</p><h3>Droit de rétractation :</h3><p>Le participant ne dispose d'aucun délai pour exercer son droit de rétractation. Les inscriptions aux formations universitaires sont dispensées par la loi du délai légal traditionnel de rétractation de 14 jours. Toute inscription est donc ferme et définitive.</p><h3>Politique de confidentialité :</h3><p>Les données de ce formulaire sont envoyées par courriel à l'agence comptable de l'université Paris 1, au responsable administratif du département gérant ce diplôme à Paris 1, ainsi qu'à vous en copie. Les données sont conservées en base de donnée pendant un an. L'université Paris 1 n'a accès à aucune de vos données bancaires car la transaction s'effectue via notre prestataire PAYBOX.</p><h3>Annulation :</h3><p>Les organisateurs se réservent le droit d’annuler cette manifestation de ce diplôme. Les versements effectués seront intégralement restitués aux participants s’étant inscrits. Aucun remboursement n'est prévu pour les participants en cas d'absence.<br>En cas d’annulation de votre part : Rien ne sera remboursé dans le cas d’une annulation de votre fait. Les organisateurs recommandent aux participants de souscrire une assurance pour cause d’annulation de leur fait.<br>&nbsp;</p>"
  participation_au_gala:
    '#type': radios
    '#title': 'Participation au Gala'
    '#options':
      30: 'Participation au Gala (tarif public) 30€'
      15: 'Participation au Gala (tarif étudiant) 15€'
      0: 'Je ne participerai pas au Gala'
    '#required': true
    '#required_error': 'Merci de renseigner le champ "Participation au Gala"'
  options_proposees:
    '#type': radios
    '#title': 'Options proposées'
    '#options':
      30: 'Acheter le livre à 30€'
      20: "Acheter l'annuaire pour 20€"
      50: "Acheter le livre et l'annuaire pour 50€"
    '#default_value': '0'
  don:
    '#type': radios
    '#title': Don
    '#options':
      150: 'Soutenir le master avec un don de 150€'
      900: 'Faire un don de 900€'
      2500: 'Faire un don de 2500€'
    '#default_value': '0'
  somme:
    '#type': webform_computed_twig
    '#title': 'Total à régulariser :'
    '#help': "<p>En fonction de l'inscription que vous avez coché et des options choisies, le montant doit s'afficher ici. Si ce n'est pas le cas, cliquez sur le bouton \"Mettre à jour\" pour rafraichir celui-ci.</p>"
    '#template': |-
      {% set somme = 0 %}
      {% set somme = somme + data.participation_au_gala + (data.options_proposees|default(0)) + (data.don|default(0)) %}
      {{ somme }}
    '#store': true
    '#ajax': true
  comment_voulez_vous_payer_:
    '#type': radios
    '#title': 'Comment voulez-vous payer ?'
    '#options':
      CB: 'Carte Bancaire'
      virement: 'Virement bancaire'
    '#options_display': side_by_side
    '#required': true
    '#required_error': 'Vous devez faire un choix pour le mode de paiement'
    '#options__properties': ''
  facturation:
    '#type': container
    '#states':
      visible:
        ':input[name="comment_voulez_vous_payer_"]':
          value: CB
    titrefacturation:
      '#type': webform_markup
      '#markup': |
        <h3>Adresse de facturation</h3>
        (indiquez le nom, pr&eacute;nom et l&#39;adresse de facturation de la carte bancaire que vous allez utiliser)
    billingfirstname:
      '#type': textfield
      '#title': Prénom
      '#placeholder': Jean
      '#required': true
      '#required_error': "Merci d'indiquer le prénom pour la facturation"
    billinglastname:
      '#type': textfield
      '#title': Nom
      '#placeholder': Dupont
      '#required': true
      '#required_error': "Merci d'indiquer le nom pour la facturation"
    billingaddress1:
      '#type': textfield
      '#title': 'Adresse postale'
      '#placeholder': '90 rue du paradis'
      '#required': true
      '#required_error': "Merci d'indiquer l'adresse postale pour la facturation"
    billingzipcode:
      '#type': textfield
      '#title': 'Code postal'
      '#placeholder': '77500'
      '#required': true
      '#required_error': "Merci d'indiquer le code postal pour la facturation"
    billingcity:
      '#type': textfield
      '#title': Ville
      '#placeholder': Chelles
      '#required': true
      '#required_error': "Merci d'indiquer la ville pour la facturation"
    billingcountrycode:
      '#type': select
      '#title': Pays
      '#options': liste_pays_code_numerique_
      '#required': true
      '#required_error': "Merci d'indiquer le pays pour la facturation"
  piaement_par_virement_bancaire:
    '#type': textfield
    '#title': "Nom du donneur d'ordre"
    '#description': "<p>Inscrivez ici le nom du donneur d'ordre.</p>"
    '#help': "<p>Le «nom du donneur d'ordre» qui peut-être différent de celui de la personne désirant s'inscrire.</p>"
    '#required': true
    '#states':
      visible:
        ':input[name="comment_voulez_vous_payer_"]':
          value: virement
  en_soumettant_ce_formulaire_j_accepte_que_les_informations_saisi:
    '#type': checkbox
    '#title': "En soumettant ce formulaire, j'accepte que les informations saisies soient exploitées dans le cadre de mon inscription au gala :"
    '#title_display': before
    '#required': true
    '#required_error': 'Vous devez accepter les conditions pour valider ce formulaire'
    '#return_value': 'Oui je donne mon autorisation'
  captcha:
    '#type': captcha
    '#captcha_type': recaptcha/reCAPTCHA
    '#captcha_admin_mode': true
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__label': Envoyer
    '#delete_hide': false
    '#delete__label': 'Supprimer mes informations'
