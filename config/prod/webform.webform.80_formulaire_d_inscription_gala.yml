  confirmation_url: 'https://esup-pay.univ-paris1.fr/evts/2022-DDL-FLE/FLEsummercourse'
  confirmation_title: ''
  confirmation_message: '<div style="display:block;position:relative;width:100%;"><p class="text-align-center" style="background-color:#00326E;color:#FFF;font-size:1.3rem;margin:0 auto;padding:1rem 2rem;text-transform:uppercase;width:max-content;">Important</p><div style="display:inline-block;margin:0 15px;padding:1rem;position:relative;vertical-align:top;width:calc(50% - 30px);"><p>Afin de terminer la procédure vous devez maintenant régulariser la somme de : [webform_submission:values:somme] €</p><p style="padding:0 2rem;"><strong>Afin de terminer la procédure nous vous invitons à cliquer sur le bouton</strong> ci-dessous (si vous avez choisi de régulariser votre paiement par Carte bancaire):</p><form action="https://esup-pay.univ-paris1.fr/evts/gala50ansM2TI/registration" method="post" name="registration"><p><input name="mail" type="hidden" value="[webform_submission:values:mail]"><input name="field1" type="hidden" value="[webform_submission:values:field1] [webform_submission:values:field2]"><input name="field2" type="hidden" value="[webform_submission:sid]"><input name="billingfirstname" type="hidden" value="[webform_submission:values:billingfirstname]"><input name="billinglastname" type="hidden" value="[webform_submission:values:billinglastname]"><input name="billingaddress1" type="hidden" value="[webform_submission:values:billingaddress1]"><input name="billingzipcode" type="hidden" value="[webform_submission:values:billingzipcode]"><input name="billingcity" type="hidden" value="[webform_submission:values:billingcity]"><input name="billingcountrycode" type="hidden" value="[webform_submission:values:billingcountrycode]"><input name="amount" type="hidden" value="[webform_submission:values:somme]"><input class="btn-subscribe" style="margin:1rem auto;width:50%;" id="Submit" name="Submit" type="submit" value="Payer par CB">&nbsp;</p></form></div><div style="border-left:1px solid #00326E;display:inline-block;margin:0 15px 0 0;padding:1rem;position:relative;width:calc(50% - 31px);"><p style="padding:0 2rem;">Si par contre <strong>vous avez préféré choisir de régulariser par un virement bancaire</strong>, n''oubliez pas d''indiquer EES-M2TI suivi de votre nom et prénom, au début de votre référence de paiement.<br>Notez cette référence pour les virements :<br>IBAN code FR76 1007 1750 0000 0010 0578 588<br>BIC (Bank Identifier Code) : TRPUFRP1<br>Transfer to : UNIVERSITE PARIS 1 AGENCE COMPTABLE<br>Bank name : TRESOR PUBLIC<br>Bank address : DRFIP ILE DE FRANCE ET DE PARIS 94 RUE REAUMUR F-75104 PARIS CEDEX 02<br>Vous avez indiqué que la personne qui ferait ce virement sera : [webform_submission:values:piaement_par_virement_bancaire] et vous devrez faire un virement de : [webform_submission:values:somme] €</p></div></div>'
