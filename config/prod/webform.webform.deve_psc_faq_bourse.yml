id: deve_psc_faq_bourse
title: 'DEVE PSC - FAQ-Bourse'
description: "<p>Veuillez choisir la question qui se rapproche le plus de votre cas concernant le bourse sur critères sociaux (CROUS) à l'université Paris 1 Panthéon-Sorbonne.&nbsp;</p>"
categories:
  - 'FAQ DEVE IA'
elements: |-
  concernant_la_bourse_je_souhaite:
    '#type': radios
    '#title': 'Concernant la Bourse, je souhaite :  '
    '#options':
      'Me renseigner (informations sur les bourses)': 'Me renseigner (informations sur les bourses)'
      'Résoudre un problème ': 'Résoudre un problème '
    '#options_display': buttons
    '#options__properties': ''
  je_souhaite_obtenir_une_information_sur_la_question_suivante:
    '#type': radios
    '#title': 'Je souhaite obtenir une information sur la question suivante :  '
    '#options':
      "Ma bourse m'a-t-elle été accordée ? ": "Ma bourse m'a-t-elle été accordée ? "
      "Je souhaite faire une demande de bourse, comment puis-je m'y prendre ?": "Je souhaite faire une demande de bourse, comment puis-je m'y prendre ?"
      "Est-ce grave si ma notification conditionnelle de bourse n'est pas attribuée au bon établissement ou n'est pas pour la bonne formation ? ": "Est-ce grave si ma notification conditionnelle de bourse n'est pas attribuée au bon établissement ou n'est pas pour la bonne formation ? "
      "Je souhaite transférer ma bourse d'un établissement à un autre, comment faire ? ": "Je souhaite transférer ma bourse d'un établissement à un autre, comment faire ? "
      "J'ai obtenu ma notification conditionnelle ou définitive, que dois-je faire? ": "J'ai obtenu ma notification conditionnelle ou définitive, que dois-je faire? "
      "Je suis boursier, mais j'ai payé mes frais de scolarité. Comment puis-je me faire rembourser des frais de scolarité ? ": "Je suis boursier, mais j'ai payé mes frais de scolarité. Comment puis-je me faire rembourser des frais de scolarité ? "
    '#states':
      visible:
        ':input[name="concernant_la_bourse_je_souhaite"]':
          value: 'Me renseigner (informations sur les bourses)'
    '#options__properties': ''
  attribution_bourse:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="je_souhaite_obtenir_une_information_sur_la_question_suivante"]':
          value: "Ma bourse m'a-t-elle été accordée ? "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Pour le savoir, je peux consulter mon <strong>D</strong>ossier <strong>S</strong>ocial <strong>É</strong>tudiant (DSE) établi auprès du <a href="https://dossier-social.etudiant.gouv.fr/bienvenue" target="_blank" rel="noreferrer noopener">CROUS.</a></p><hr><p>Si j''ai d''autres questions concernant un autre domaine, <a href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/"><strong>je peux revenir à l''accueil de la foire aux questions</strong></a></p><p>Si la réponse ne me suffit pas, je peux demander des précisions en faisant <a href="mailto:bourses@univ-paris1.fr" target="_blank"><strong>un ticket</strong></a> à l''administration.</p><p>Si je n''ai pas d''autres questions, je peux revenir au <a href="https://www.pantheonsorbonne.fr/inscription">site internet des inscriptions</a>.&nbsp;</p><p>&nbsp;</p><p>&nbsp;</p>'
  demander_une_bourse:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="je_souhaite_obtenir_une_information_sur_la_question_suivante"]':
          value: "Je souhaite faire une demande de bourse, comment puis-je m'y prendre ?"
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Je peux faire ma demande ou simulation sur le site suivant :</p><p><a href="https://messervices.etudiant.gouv.fr/" target="_blank" rel="noreferrer noopener">https://messervices.etudiant.gouv.fr/</a></p><hr><p>Si j''ai d''autres questions concernant un autre domaine, <a href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/"><strong>je peux revenir à l''accueil de la foire aux questions</strong></a></p><p>Si la réponse ne me suffit pas, je peux demander des précisions en faisant <a href="mailto:bourses@univ-paris1.fr" target="_blank"><strong>un ticket</strong></a> à l''administration.</p><p>Si je n''ai pas d''autres questions, je peux revenir au <a class="ext" href="https://www.pantheonsorbonne.fr/inscription" target="_blank" rel="noopener noreferrer" data-extlink="">site internet des inscriptions</a>.&nbsp;</p>'
  bourse_par_etablissement:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="je_souhaite_obtenir_une_information_sur_la_question_suivante"]':
          value: "Est-ce grave si ma notification conditionnelle de bourse n'est pas attribuée au bon établissement ou n'est pas pour la bonne formation ? "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Non, ma notification de bourse <strong>conditionnelle </strong>peut être pour un autre établissement ou une autre formation.</p><p>En revanche,<strong> ma notification définitive doit correspondre</strong> au bon établissement et à la bonne formation.</p><hr><p>Si j''ai d''autres questions concernant un autre domaine, <a href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/"><strong>je peux revenir à l''accueil de la foire aux questions</strong></a></p><p>Si la réponse ne me suffit pas, je peux demander des précisions en faisant <a href="mailto:bourses@univ-paris1.fr" target="_blank"><strong>un ticket</strong></a> à l''administration.</p><p>Si je n''ai pas d''autres questions, je peux revenir au <a class="ext" href="https://www.pantheonsorbonne.fr/inscription" target="_blank" rel="noopener noreferrer" data-extlink="">site internet des inscriptions</a>.&nbsp;</p>'
  transferer_ma_bourse:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="je_souhaite_obtenir_une_information_sur_la_question_suivante"]':
          value: "Je souhaite transférer ma bourse d'un établissement à un autre, comment faire ? "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Je dois d''abord faire retirer mon statut de boursier de l''autre établissement, auprès du service des bourses, je peux ensuite faire ma demande de transfert définitive auprès du CROUS sur mon <a href="https://dossier-social.etudiant.gouv.fr/bienvenue" target="_blank" rel="noreferrer noopener">espace Dossier Social Étudiant (DSE)</a>&nbsp; vers l''établissement souhaité.</p><p><strong>ATTENTION </strong>:&nbsp;</p><ul><li data-list-item-id="eba786318e3ff861406b5b1f739295c6b">il n''est pas possible d''être boursier dans 2 établissements. Veillez donc à bien retirer votre bourse votre "ancien" établissement</li><li data-list-item-id="e9b8ea937b7c4b14af9d2fd4906d0f42f">certaines formations, comme les DU ne sont pas éligibles à la bourse. Renseignez-vous auprès du <a href="https://www.pantheonsorbonne.fr/formation/departements" target="_blank" rel="noreferrer noopener">service</a> qui gère votre formation.&nbsp;</li><li data-list-item-id="e2c6fc1473b578bf950ea4591c2d7cc0e">les inscriptions sous le régime de l''apprentissage n''ouvrent aucun droit à la bourse</li></ul><hr><p>Si j''ai d''autres questions concernant un autre domaine, <a href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/"><strong>je peux revenir à l''accueil de la foire aux questions</strong></a></p><p>Si la réponse ne me suffit pas, je peux demander des précisions en faisant <a href="mailto:bourses@univ-paris1.fr" target="_blank"><strong>un ticket</strong></a> à l''administration.</p><p>Si je n''ai pas d''autres questions, je peux revenir au <a class="ext" href="https://www.pantheonsorbonne.fr/inscription" target="_blank" rel="noopener noreferrer" data-extlink="">site internet des inscriptions</a>.&nbsp;</p>'
  notification_de_bourse:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="je_souhaite_obtenir_une_information_sur_la_question_suivante"]':
          value: "J'ai obtenu ma notification conditionnelle ou définitive, que dois-je faire? "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Je dois ajouter ma notification sur PJWEB (Outil que vous trouverez dans l''ENT) si je suis renseigné en tant que boursier à Paris 1, autrement je dois la transmettre par mail à :</p><p><a href="mailto:bourses@univ-paris1.fr?body=N%C2%B0%20%C3%A9tudiant%20%3A%20">bourses@univ-paris1.fr</a></p><hr><p>Si j''ai d''autres questions concernant un autre domaine, <a href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/"><strong>je peux revenir à l''accueil de la foire aux questions</strong></a></p><p>Si la réponse ne me suffit pas, je peux demander des précisions en faisant <a href="mailto:bourses@univ-paris1.fr" target="_blank"><strong>un ticket</strong></a> à l''administration.</p><p>Si je n''ai pas d''autres questions, je peux revenir au <a class="ext" href="https://www.pantheonsorbonne.fr/inscription" target="_blank" rel="noopener noreferrer" data-extlink="">site internet des inscriptions</a>.&nbsp;</p>'
  remboursement_frais:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="je_souhaite_obtenir_une_information_sur_la_question_suivante"]':
          value: "Je suis boursier, mais j'ai payé mes frais de scolarité. Comment puis-je me faire rembourser des frais de scolarité ? "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>J''ai payé mes frais de scolarité alors que je bénéficie d''une bourse du CROUS sur critères sociaux.&nbsp;</p><p>Pour faire une demande de remboursement, il faut remplir le<a href="https://ent-intranet.pantheonsorbonne.fr/form/deve-psc-demande-de-remboursemen" target="_blank" rel="noreferrer noopener"><strong> formulaire de demande de remboursement</strong></a>, disponible sur l''ENT/intranet à cette adresse :&nbsp;<a href="https://ent-intranet.pantheonsorbonne.fr/remboursement-des-droits-universitaires-des-etudiants-boursiers-et-autres" target="_blank" rel="noreferrer noopener">https://ent-intranet.pantheonsorbonne.fr/remboursement-des-droits-universitaires-des-etudiants-boursiers-et-autres</a></p><hr><p>Si j''ai d''autres questions concernant un autre domaine, <a href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/"><strong>je peux revenir à l''accueil de la foire aux questions</strong></a></p><p>Si la réponse ne me suffit pas, je peux demander des précisions en faisant <a href="mailto:bourses@univ-paris1.fr" target="_blank"><strong>un ticket</strong></a> à l''administration.</p><p>Si je n''ai pas d''autres questions, je peux revenir au <a class="ext" href="https://www.pantheonsorbonne.fr/inscription" target="_blank" rel="noopener noreferrer" data-extlink="">site internet des inscriptions</a>.&nbsp;</p>'
  j_ai_le_probleme_suivant_concernant_ma_bourse:
    '#type': radios
    '#title': "J'ai le problème suivant concernant ma bourse :  "
    '#options':
      "Je n'ai pas été remboursé de ma CVEC, que dois-je faire ? ": "Je n'ai pas été remboursé de ma CVEC, que dois-je faire ? "
      "J'ai eu ma bourse en retard, comment puis-je demander une rétroactivité de mes versements ? ": "J'ai eu ma bourse en retard, comment puis-je demander une rétroactivité de mes versements ? "
      "J'ai reçu un courriel m'informant que ma bourse allait être suspendue ": "J'ai reçu un courriel m'informant que ma bourse allait être suspendue "
    '#states':
      visible:
        ':input[name="concernant_la_bourse_je_souhaite"]':
          value: 'Résoudre un problème '
    '#options__properties': ''
  remboursement_cvec:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="j_ai_le_probleme_suivant_concernant_ma_bourse"]':
          value: "Je n'ai pas été remboursé de ma CVEC, que dois-je faire ? "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Le remboursement de la CVEC n''est pas automatique,&nbsp; une demande en ligne doit être faite sur le <a href="https://cvec.etudiant.gouv.fr/">site du </a><a href="https://cvec.etudiant.gouv.fr/" target="_blank" rel="noreferrer noopener">CROUS</a></p><p>sinon consulter l''onglet "<strong>Être remboursé</strong>" du lien suivant :&nbsp;</p><p><a href="https://cvec.etudiant.gouv.fr/">https://cvec.etudiant.gouv.fr/</a></p><hr><p>Si j''ai d''autres questions concernant un autre domaine, <a href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/"><strong>je peux revenir à l''accueil de la foire aux questions</strong></a></p><p>Si la réponse ne me suffit pas, je peux demander des précisions en faisant <a href="mailto:bourses@univ-paris1.fr" target="_blank"><strong>un ticket</strong></a> à l''administration.</p><p>Si je n''ai pas d''autres questions, je peux revenir au <a class="ext" href="https://www.pantheonsorbonne.fr/inscription" target="_blank" rel="noopener noreferrer" data-extlink="">site internet des inscriptions</a>.&nbsp;</p><p>&nbsp;</p>'
  versement_retroactif:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="j_ai_le_probleme_suivant_concernant_ma_bourse"]':
          value: "J'ai eu ma bourse en retard, comment puis-je demander une rétroactivité de mes versements ? "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Si ma demande de bourse a été correctement attribuée, je peux demander un certificat d''assiduité à mon <a href="https://www.pantheonsorbonne.fr/formation/departements">secrétariat pédagogique</a> puis l''envoyer à :</p><p><a href="mailto:bourses@univ-paris1.fr?body=N%C2%B0%20%C3%A9tudiant%20%3A">bourses@univ-paris1.fr</a></p><hr><p>Si j''ai d''autres questions concernant un autre domaine, <a href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/"><strong>je peux revenir à l''accueil de la foire aux questions</strong></a></p><p>Si la réponse ne me suffit pas, je peux demander des précisions en faisant <a href="mailto:bourses@univ-paris1.fr" target="_blank"><strong>un ticket</strong></a> à l''administration.</p><p>Si je n''ai pas d''autres questions, je peux revenir au <a class="ext" href="https://www.pantheonsorbonne.fr/inscription" target="_blank" rel="noopener noreferrer" data-extlink="">site internet des inscriptions</a>.&nbsp;</p>'
  suspension_de_bourse:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="j_ai_le_probleme_suivant_concernant_ma_bourse"]':
          value: "J'ai reçu un courriel m'informant que ma bourse allait être suspendue "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>La bourse sur critères sociaux est accordée sur la base de plusieurs critères et engagements : les bénéficiaires s''engagent à être assidus en cours ET aux examens, à apporter un justificatif valable et documenté d''éventuelles absences, à ne pas exercer une activité professionnelle qui vous empêcherait de respecter votre obligation d''assiduité aux cours et aux examens.&nbsp;<br><br>En cours d''année, le service des Bourses de paris 1 Panthéon-Sorbonne s''assure du respect de ces engagements et procède à des <strong>vérifications systématiques</strong>. En cas de constatation d''un potentiel manquement aux engagements, le service des Bourses contacte les contrevenants pour leur demander de justifier leur situation. Si aucun retour n''est fait par les étudiants concernés dans les délais impartis, ceux-ci verront leur bourse suspendue, avec demande de remboursement*.&nbsp;<br>Si vous recevez un tel courrier, vous devez répondre et apporter les justificatifs demandés dans les délais fixés, en écrivant à l''adresse <a href="mailto:bourses@univ-paris1.fr?body=N%C2%B0%20%C3%A9tudiant%20%3A%20">bourses@univ-paris1.fr</a></p><p>*<em>Si vous êtes concerné(e), surveillez bien ces mails, car lorsque la demande remboursement vous sera faite par le Trésor public, généralement dans un délai de 2 ans, il sera trop tard, sans<strong> aucune</strong> possibilité de recours.</em></p><hr><p>Si j''ai d''autres questions concernant un autre domaine, <a href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/"><strong>je peux revenir à l''accueil de la foire aux questions</strong></a></p><p>Si la réponse ne me suffit pas, je peux demander des précisions en faisant <a href="mailto:bourses@univ-paris1.fr" target="_blank"><strong>un ticket</strong></a> à l''administration.</p><p>Si je n''ai pas d''autres questions, je peux revenir au <a class="ext" href="https://www.pantheonsorbonne.fr/inscription" target="_blank" rel="noopener noreferrer" data-extlink="">site internet des inscriptions</a>.&nbsp;</p>'
