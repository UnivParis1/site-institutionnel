id: 17_formulaire_inscription_format
title: '17- Formulaire inscription formation courte INTER'
description: ''
categories: {  }
elements: |-
  mes_informations:
    '#type': webform_wizard_page
    '#title': 'Mes informations'
    nom:
      '#type': textfield
      '#title': 'Nom de naissance'
      '#required': true
    nom_d_usage:
      '#type': textfield
      '#title': "Nom d'usage"
    prenom:
      '#type': textfield
      '#title': Prénom
      '#required': true
    date_de_naissance:
      '#type': date
      '#title': 'Date de naissance'
      '#required': true
    lieu_de_naissance:
      '#type': textfield
      '#title': 'Lieu de naissance'
      '#required': true
    adresse:
      '#type': webform_address
      '#title': Adresse
      '#required': true
      '#address_2__access': false
      '#state_province__access': false
    courriel:
      '#type': email
      '#title': Courriel
      '#required': true
    telephone:
      '#type': webform_telephone
      '#title': Téléphone
      '#required': true
      '#type__access': false
      '#ext__access': false
      '#phone__international': false
    situation:
      '#type': webform_radios_other
      '#title': Situation
      '#options':
        Salarié: Salarié.e
        DE: "Demandeur.se d'emploi"
        étudiant: Étudiant.e
      '#required': true
      '#options__properties': ''
  formation_a_laquelle_je_souhaite_m_inscrire:
    '#type': webform_wizard_page
    '#title': "Formation à laquelle je souhaite m'inscrire"
    intitule_de_la_formation_a_laquelle_je_souhaite_m_inscrire:
      '#type': textfield
      '#title': "Intitulé complet de la formation à laquelle je souhaite m'inscrire"
      '#required': true
    date_s_de_la_session:
      '#type': textfield
      '#title': 'Date(s) de la session'
      '#required': true
    nombre_d_heures:
      '#type': textfield
      '#title': "Nombre d'heures"
    tarifs:
      '#type': textfield
      '#title': Tarifs
    comment_avez_vous_connu_cette_formation:
      '#type': webform_checkboxes_other
      '#title': 'Comment avez-vous connu cette formation'
      '#options':
        'Recherche sur internet': 'Recherche sur internet'
        Linkedin: Linkedin
        Publicité: Publicité
      '#options__properties': ''
    quelles_sont_vos_attentes_et_besoins_vis_a_vis_de_cette_formatio:
      '#type': textarea
      '#title': 'Quelles sont vos attentes et besoins vis-à-vis de cette formation ?'
      '#required': true
    y_a_t_il_des_questions_sujets_que_vous_souhaiteriez_voir_traite:
      '#type': textarea
      '#title': 'Y-a-t-il des questions, sujets que vous souhaiteriez voir traité.es en particulier ?'
    autre_s_informations_que_vous_souhaiteriez_communiquer_a_notre_s:
      '#type': textarea
      '#title': 'Autre(s) informations que vous souhaiteriez communiquer à notre service (mobilité réduite...)'
  mon_mode_de_financement:
    '#type': webform_wizard_page
    '#title': 'Mode de financement'
    mode_de_financement:
      '#type': checkboxes
      '#title': 'Mode de financement'
      '#options':
        Individuel: Individuel
        'Pris en charge par un tiers': 'Pris en charge par un tiers (France Travail région...)'
        Employeur: Employeur
      '#required': true
      '#options__properties': ''
    nom_de_l_entreprise:
      '#type': textfield
      '#title': "Nom de l'entreprise"
      '#states':
        visible:
          ':input[name="mode_de_financement[Employeur]"]':
            checked: true
    siret:
      '#type': textfield
      '#title': SIRET
      '#states':
        visible:
          ':input[name="mode_de_financement[Employeur]"]':
            checked: true
    code_ape:
      '#type': textfield
      '#title': 'Code APE'
      '#states':
        visible:
          ':input[name="mode_de_financement[Employeur]"]':
            checked: true
    adresse_entreprise:
      '#type': webform_address
      '#title': 'Adresse entreprise'
      '#states':
        visible:
          ':input[name="mode_de_financement[Employeur]"]':
            checked: true
      '#address_2__access': false
      '#state_province__access': false
    responsable_formation_prenom_nom:
      '#type': textfield
      '#title': 'Responsable formation (Prénom NOM)'
      '#states':
        visible:
          ':input[name="mode_de_financement[Employeur]"]':
            checked: true
    courriel_du_responsable:
      '#type': email
      '#title': 'Courriel du responsable'
      '#states':
        visible:
          ':input[name="mode_de_financement[Employeur]"]':
            checked: true
  questionnaire_d_auto_positionnement:
    '#type': webform_wizard_page
    '#title': "Questionnaire d'auto-positionnement"
    comment_evaluez_vous_votre_niveau_d_experience_dans_le_domaine_d:
      '#type': radios
      '#title': "Comment évaluez-vous votre niveau d'expérience dans le domaine de la formation concernée par ce questionnaire  ?"
      '#options':
        Débutant: "Débutant(e) : Aucune ou très peu d'expérience"
        Intermédiaire: "Intermédiaire : Des connaissances de base, mais pas encore à l'aise"
        Avancé: 'Avancé(e) : Des compétences solides et une certaine aisance'
        Expert: 'Expert(e) : Une maîtrise approfondie'
      '#required': true
      '#options__properties': ''
    depuis_combien_de_temps_exercez_vous_une_activite_professionnell:
      '#type': radios
      '#title': 'Depuis combien de temps exercez-vous une activité professionnelle dans le domaine de cette formation ?  '
      '#options':
        'moins de 3 ans': 'Moins de 3 ans'
        'Entre 3 et 5 ans': 'Entre 3 et 5 ans'
        'Entre 5 et 8 ans': 'Entre 5 et 8 ans'
        'Plus de 8 ans': 'Plus de 8 ans'
      '#required': true
      '#options__properties': ''
    avez_vous_deja_suivi_des_formations_sur_le_meme_theme_si_oui_veu:
      '#type': textarea
      '#title': 'Avez-vous déjà suivi des formations sur le même thème ? Si oui, veuillez les décrire brièvement.'
    en_vous_inscrivant_a_cette_formation_quel_est_votre_objectif_pri:
      '#type': webform_radios_other
      '#title': 'En vous inscrivant à cette formation, quel est votre objectif principal ?'
      '#options':
        'Acquérir de nouvelles compétences': 'Acquérir de nouvelles compétences'
        'Progresser dans votre carrière': 'Progresser dans votre carrière'
        'Changer de domaine professionnel': 'Changer de domaine professionnel'
        'Obtenir une certification': 'Obtenir une certification'
      '#required': true
      '#options__properties': ''
  confirmation:
    '#type': webform_wizard_page
    '#title': Confirmation
    en_validant_ce_formulaire_je_me_pre_inscris_a_la_formation:
      '#type': radios
      '#title': "En validant ce formulaire, je confirme que je souhaite m'inscrire à la formation."
      '#options':
        oui: oui
      '#required': true
      '#options__properties': ''
  actions:
    '#type': webform_actions
    '#title': "Bouton(s) d'envoi"
    '#submit__label': "Je m'inscris"
