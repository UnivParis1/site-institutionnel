    '#title': 'Données à caractère personnel'
    '#description': '<p class="whitespace-pre-wrap break-words">En soumettant ce formulaire, j''accepte que les informations saisies soient utilisées par la Chaire Grands enjeux stratégiques contemporains pour :</p><div style="padding-bottom:15px;padding-left:25px;padding-top:10px;"><ul><li>La gestion de mon inscription aux conférences</li><li>L''envoi des informations pratiques liées aux événements</li><li>La communication des actualités de la Chaire</li></ul></div><p class="whitespace-pre-wrap break-words">Ces données sont conservées pendant la durée du cycle de conférences et jusqu''à un an après sa fin. Conformément au RGPD, vous disposez d''un droit d''accès, de rectification et de suppression de vos données personnelles.</p>'
