      body: '<p class="text-align-center"><img loading="lazy" src="/sites/default/files/styles/cke_media_resize_small/public/2025-01/logo-email.jpg.webp?itok=gs6ELY9X" width="200" height="200" alt=""></p><h2 class="text-align-center">Chaire Grands enjeux stratégiques contemporains</h2><h3 class="text-align-center">L''avenir des alliances militaires</h3><p class="whitespace-pre-wrap break-words">Bonjour,</p><p class="whitespace-pre-wrap break-words">Nous avons bien pris en compte et vous remercions de votre inscription à la Chaire Grands enjeux stratégiques contemporains.</p><p class="whitespace-pre-wrap break-words">Pour rappel, les conférences se tiendront de 18h à 20h avec un accueil du public dès 17h.&nbsp;</p><p class="whitespace-pre-wrap break-words">Voici le récapitulatif de vos informations d''inscription.</p><p>[webform_submission:values]</p><h3>Mettre à jour votre inscription&nbsp;</h3><p>Vous souhaitez modifier votre inscription ou votre mode de participation aux conférences (présentiel/distanciel) ?&nbsp;</p><p>Cliquez sur le lien personnalisé ci-dessous pour accéder à votre espace participant :</p><p>[webform_submission:token-update-url]</p><p>Vous remerciant de votre inscription.&nbsp;<br>Chaire Grands enjeux stratégiques contemporains&nbsp;</p>'
