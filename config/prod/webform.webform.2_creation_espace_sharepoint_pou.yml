title: "2 - Création espace Sharepoint pour l'intranet"
description: ''
categories: {  }
elements: |-
  nom:
    '#type': hidden
    '#title': Nom
    '#default_value': '[cas:attribute:sn]'
  prenom:
    '#type': hidden
    '#title': Prénom
    '#default_value': '[cas:attribute:givenname]'
  courriel:
    '#type': hidden
    '#title': Courriel
    '#default_value': '[cas:attribute:mail]'
  quel_serait_le_nom_de_cette_bibliotheque:
    '#type': textfield
    '#title': 'Quel serait le nom de cette bibliothèque ?'
    '#help': "<p>Note : afin d'avoir une certaine homogénéité sur l'ensemble des bibliothèques, si votre structure à un acronyme (exemple EAS, pour École des Arts de la Sorbonne), nous utiliserons celui-ci.</p>"
    '#placeholder': 'exemple : EAS'
    '#required': true
    '#required_error': 'Indiquez le nom de la bibliothèque'
  membre:
    '#type': textarea
    '#title': 'Qui sera(seront) le(s) contributeur(s) ?'
    '#help': '<p>Les personnes listées ici auront la main pour écrire dans cette bibliothèque SharePoint.</p>'
    '#placeholder': 'idem, mettez le nom et prénom du ou des personnes qui pourront gérer les fichiers dans ce sharepoint'
    '#required': true
    '#required_error': 'Vous devez indiquer à minima une personne qui pourra contribuer dans ce SharePoint.'
  visiteur:
    '#type': checkboxes
    '#title': 'Qui pourra voir et lire les fichiers ?'
    '#help': '<p>Cochez la ou les cases répondant à votre besoin</p>'
    '#options':
      "Tous les membres de l'université": "Tous les membres de l'université"
      "Tous les étudiants de l'université": "Tous les étudiants de l'université"
      "Tous les personnels de l'université": "Tous les personnels de l'université"
      'Uniquement les étudiants de ma structure': 'Uniquement les étudiants de ma structure'
      'Uniquement les personnels de ma structure': 'Uniquement les personnels de ma structure'
      Autre: Autre
    '#required': true
    '#required_error': 'Vous devez cocher au minimum une case pour savoir qui pourra lire les fichiers.'
  vous_avez_coche_autre_merci_de_detailler_votre_besoin:
    '#type': textarea
    '#title': 'Vous avez coché "Autre", merci de détailler votre besoin'
    '#required': true
    '#required_error': "Merci d'indiquer qui sont les Autres."
    '#states':
      visible:
        ':input[name="visiteur[Autre]"]':
          checked: true
