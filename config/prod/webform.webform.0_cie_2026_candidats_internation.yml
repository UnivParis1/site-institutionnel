  confirmation_url: ''
  confirmation_title: ''
  confirmation_message: '<p>Madame, Monsieur,<br><br>Nous vous remercions vivement pour l''intérêt que vous portez au Concours international d’éloquence !<br><br>Votre demande d''inscription a bien été prise en compte. Vous recevrez prochainement un mail vous indiquant si vous faites partie des 50 sélectionnés <u>ou</u> si votre inscription ne peut malheureusement être prise en compte pour cette édition.<br><br>Si votre candidature répond aux critères d’éligibilité énoncés dans le règlement du concours, vous serez invité à transmettre à l’université une vidéo de motivation répondant à la question : “pourquoi devrions-nous vous sélectionner pour ce concours ?” en reprenant, autant que faire se peut dans le temps imparti, les codes de l’éloquence. Celle-ci sera d’une durée maximale d’une minute trente.<br><br>Nous vous invitons, d''ores et déjà, à consulter la rubrique "Je suis candidat francophone international" du site <a href="http://eloquence.pantheonsorbonne.fr" target="_blank">https://</a><a style="color:#1264a3;text-decoration:none;" href="http://eloquence.pantheonsorbonne.fr" target="_blank" rel="noopener noreferrer" url="http://eloquence.pantheonsorbonne.fr" data-sk="tooltip_parent">eloquence.pantheonsorbonne.fr</a><a href="http://eloquence.pantheonsorbonne.fr" target="_blank">/je-suis-etudiant-francophone-linternational</a>. vous y retrouverez l''ensemble des modalités de participation, ainsi que des conseils pratiques pour réaliser votre vidéo.<br><br>Cordialement,</p>'
