id: 10_antidote_web
title: '10 - Antidote web'
description: '<p>Lien dans les pages :</p><ul><li>Antidote</li><li>Accompagnement des publics en situation de handicap</li></ul>'
categories: {  }
elements: |-
  nom:
    '#type': textfield
    '#title': Nom
    '#required': true
  prenom:
    '#type': textfield
    '#title': Prénom
    '#required': true
  numero_d_etudiant_e:
    '#type': textfield
    '#title': "Numéro d'étudiant·e"
    '#required': true
  telephone:
    '#type': webform_telephone
    '#title': Téléphone
    '#required': true
    '#type__access': false
    '#ext__access': false
    '#phone__international_initial_country': FR
  courriel:
    '#type': email
    '#title': Courriel
    '#description': '<p>Utilisez votre adresse courriel de Paris 1</p>'
    '#description_display': before
    '#placeholder': prenom.nom@univ-paris1.fr
    '#required': true
  niveau_d_etudes:
    '#type': webform_radios_other
    '#title': "Niveau d'études"
    '#options':
      Licence: Licence
      Master: Master
      Doctorat: Doctorat
    '#other__placeholder': Complétez...
    '#required': true
    '#unique': true
    '#options__properties': ''
  filiere:
    '#type': textfield
    '#title': Filière
    '#placeholder': 'MIASHS, sciences sociales, histoire...'
    '#required': true
    '#unique': true
  horizontal_rule:
    '#type': webform_horizontal_rule
  je_souhaite:
    '#type': radios
    '#title': 'Je souhaite...'
    '#options':
      'Emprunter une licence Antidote pour la première fois': 'Emprunter une licence Antidote pour la première fois'
      'Prolonger mon emprunt en cours': 'Prolonger mon emprunt en cours'
      'Emprunter à nouveau une licence Antidote': 'Emprunter à nouveau une licence Antidote'
    '#required': true
    '#options__properties': ''
  info_formation:
    '#type': item
    '#title': 'Info formation'
    '#states':
      visible-slide:
        ':input[name="je_souhaite"]':
          filled: true
    '#markup': '<p>Si vous ne connaissez pas encore Antidote, suivez nos formations en 30min, <a href="https://bibliotheques.pantheonsorbonne.fr/formation/biblioflash">Biblioflash</a> (sur place et sans rendez-vous), <a href="https://bibliotheques.pantheonsorbonne.fr/formaflex">FormaFlex</a> (sur-mesure et sur rendez-vous), ou accéder à nos tutoriels dans <a href="https://cours.univ-paris1.fr/pluginfile.php/2075728/mod_label/intro/Presentation%20Antidote.mp4">BOB (la boîte à outils de la bibliothèque)</a> !</p>'
  pour_quelle_duree:
    '#type': webform_radios_other
    '#title': 'Pour quelle durée ?'
    '#options':
      "1 semaine : Je teste l'outil": "1 semaine : Je teste l'outil"
      '2 semaines': '2 semaines'
      "1 mois : J'écris un mémoire, une thèse": "1 mois : J'écris un mémoire, une thèse"
      "2 mois : J'écris un mémoire, une thèse": "2 mois : J'écris un mémoire, une thèse"
    '#other__placeholder': 'Je précise la durée et le motif (mémoire, thèse...)'
    '#required': true
    '#unique': true
    '#options__properties': ''
  sur_un_texte_en:
    '#type': radios
    '#title': 'Sur un texte en...'
    '#options':
      Français: Français
      Anglais: Anglais
      'Français et anglais': 'Français et anglais'
    '#required': true
    '#options__properties': ''
  horizontal_rule_01:
    '#type': webform_horizontal_rule
  je_suis_accompagne_par_le_relais_handicap_de_l_universite_pour:
    '#type': radios
    '#title': "Je suis accompagné·e par le Relais Handicap de l'université pour des troubles de l'apprentissage : dyslexie, dysorthographie..."
    '#options':
      Oui: Oui
      Non: Non
    '#required': true
    '#options__properties': ''
  je_souhaite_utiliser_antidote_parce_que:
    '#type': webform_checkboxes_other
    '#title': 'Je souhaite utiliser Antidote parce que...'
    '#options':
      'Je voudrais améliorer ma rédaction': 'Je voudrais améliorer ma rédaction'
      'Je voudrais progresser en français ou en anglais': 'Je voudrais progresser en français ou en anglais'
      "Le français n'est pas ma langue maternelle": "Le français n'est pas ma langue maternelle"
      "J'ai un trouble de l'apprentissage (dys...)": "J'ai un trouble de l'apprentissage (dys...)"
    '#options_display': buttons_vertical
    '#other__placeholder': 'Parce que...'
    '#options__properties': ''
  j_utilise_antidote_sur:
    '#type': webform_radios_other
    '#title': "J'utilise Antidote sur..."
    '#options':
      'Un mémoire': 'Un mémoire'
      'Une thèse': 'Une thèse'
    '#other__placeholder': 'Je décris mon travail en cours...'
    '#options__properties': ''
  j_ai_une_precision_a_apporter_a_ma_demande_facultatif:
    '#type': textarea
    '#title': "J'ai une précision à apporter à ma demande (facultatif)"
  captcha:
    '#type': captcha
    '#captcha_type': recaptcha/reCAPTCHA
  terms_of_service:
    '#type': webform_terms_of_service
    '#title': "J'accepte les conditions de service"
    '#more': '<p>En soumettant ce formulaire, j''accepte que les informations saisies soient exploitées dans le cadre de ma demande d''emprunt d''une licence Antidote.</p><p>Les données collectées seront communiquées aux destinataires suivants : les agent·es du Service commun de la documentation. Seuls vos nom, prénom et courriel seront transmis à Antidote Web pour la création de votre compte.</p><p>Les données collectées sont conservées selon le <a href="https://donnees-personnelles.pantheonsorbonne.fr/gestion-vos-donnees-personnelles/reglement-general-protection-donnees">Règlement général sur la protection des données personnelles applicable à l''université Paris 1 Panthéon-Sorbonne</a>.<br>➜ <a href="https://donnees-personnelles.pantheonsorbonne.fr/">En savoir plus</a></p>'
    '#required': true
    '#terms_type': slideout
    '#terms_content': '<p>En soumettant ce formulaire, j''accepte que les informations saisies soient exploitées dans le cadre de ma demande d''emprunt d''une licence Antidote.</p><p>Les données collectées seront communiquées aux destinataires suivants : les agent·es du Service commun de la documentation. Seuls vos nom, prénom et courriel seront transmis à Antidote Web pour la création de votre compte.</p><p>Les données collectées sont conservées selon le <a href="https://donnees-personnelles.pantheonsorbonne.fr/gestion-vos-donnees-personnelles/reglement-general-protection-donnees">Règlement général sur la protection des données personnelles applicable à l''université Paris 1 Panthéon-Sorbonne</a>.<br>➜ <a href="https://donnees-personnelles.pantheonsorbonne.fr/">En savoir plus</a></p>'
  actions:
    '#type': webform_actions
    '#title': "Bouton(s) d'envoi"
    '#submit__label': "J'envoie ma demande"
