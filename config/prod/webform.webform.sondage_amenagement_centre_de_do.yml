id: sondage_amenagement_centre_de_do
title: 'Sondage - Aménagement - Centre de documentation André Tunc'
description: '<p>Cher(e)s doctorant(e)s,</p><p>Ce message pour vous questionner sur un choix d’aménagement intérieur de la bibliothèque.</p><p>Comme vous l’avez vu, nous avons transféré sur le côté gauche dans le premier espace, les ordinateurs en libre-service, libérant le côté à droite de la porte</p><p>Nous avons la possibilité, si vous le souhaitez, d’aménager à cet endroit un espace détente avec la réserve d’éventuelles nuisances sonores.</p><p>Nous pouvons aussi faire le choix d’installer cet espace dans la dernière pièce, celle qui vous est réservée. Devant ces options, nous souhaitons recueillir votre avis et vos souhaits, au travers de ce petit questionnaire que nous vous demandons s’il vous plait, de nous retourner avant le 15 mars</p><p><strong><u>Les réponses seront anonymisées</u></strong></p>'
categories:
  - Avis
elements: |-
  souhaitez_vous_l_amenagement_d_un_espace_convivialite:
    '#type': checkboxes
    '#title': 'Souhaitez-vous l’aménagement d’un espace convivialité au sein de la bibliothèque ?'
    '#multiple': 2
    '#options':
      Oui: Oui
      Non: Non
    '#required': true
    '#options__properties': ''
  souhaitez_vous_un_amenagement_dans_la_premiere_piece:
    '#type': checkboxes
    '#title': 'Souhaitez-vous un aménagement dans la première pièce sur la droite ?'
    '#options':
      Oui: Oui
      Non: Non
    '#required': true
    '#options__properties': ''
  souhaitez_vous_plutot_un_coin_detente_dans_la_piece_qui_vous_est:
    '#type': checkboxes
    '#title': 'Souhaitez-vous plutôt un coin détente dans la pièce qui vous est réservée ?'
    '#options':
      Oui: Oui
      Non: Non
    '#required': true
    '#options__properties': ''
  aimeriez_vous:
    '#type': checkboxes
    '#title': 'Aimeriez-vous :'
    '#options':
      'Une banquette avec coussins ?': 'Une banquette avec coussins ?'
      'Un ou plusieurs canapés ?': 'Un ou plusieurs canapés ?'
      'Un ou plusieurs bancs ?': 'Un ou plusieurs bancs ?'
      'Plusieurs fauteuils ?': 'Plusieurs fauteuils ?'
      'Plusieurs poufs ?': 'Plusieurs poufs ?'
      'Une table basse ?': 'Une table basse ?'
    '#options__properties': ''
    '#required': true
  vos_suggestions:
    '#type': textarea
    '#title': 'Vos suggestions'
