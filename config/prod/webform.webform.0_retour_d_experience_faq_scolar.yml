elements: |-
  processed_text_03:
    '#type': processed_text
    '#text': '<h3>Contribuez à cette FAQ en donnant votre avis</h3><p><em>(Ce formulaire est anonyme)</em></p>'
    '#format': full_html
  souhaitez_vous_ajouter_un_commentaire_vis_a_vis_de_cette_page:
    '#type': radios
    '#title': 'Quel type de retour souhaitez-vous faire ?'
    '#options':
      Complimenter: Complimenter
      'Faire une suggestion': 'Faire une suggestion'
      'Signaler un problème sur la FAQ': 'Signaler un problème sur la FAQ'
    '#options_display': buttons
    '#required': true
    '#required_error': 'Le champ Quel type de retour souhaitez-vous faire ? est obligatoire'
    '#options__properties': ''
  vous_pouvez_nous_laisser_un_commentaire_dans_le_champ_ci_dessous:
    '#type': textarea
    '#title': 'Vous pouvez nous laisser un commentaire dans le champ ci-dessous :'
    '#states':
      visible:
        ':input[name="souhaitez_vous_ajouter_un_commentaire_vis_a_vis_de_cette_page"]':
          value: Complimenter
  indiquez_nous_dans_le_champ_ci_dessous_la_suggestion_que_vous_so:
    '#type': textarea
    '#title': 'Indiquez nous dans le champ ci-dessous la suggestion que vous souhaitez nous partager :'
    '#states':
      visible:
        ':input[name="souhaitez_vous_ajouter_un_commentaire_vis_a_vis_de_cette_page"]':
          value: 'Faire une suggestion'
    '#required': true
  precisez_la_raison_du_probleme:
    '#type': checkboxes
    '#title': 'Précisez la raison du problème :'
    '#options':
      'Information(s) manquante(s)': 'Information(s) manquante(s)'
      'Clarté des informations': 'Clarté des informations'
    '#states':
      visible:
        ':input[name="souhaitez_vous_ajouter_un_commentaire_vis_a_vis_de_cette_page"]':
          value: 'Signaler un problème'
    '#options__properties': ''
  merci_de_decrire_dans_le_champ_ci_dessous_le_probleme_que_vous_s:
    '#type': textarea
    '#title': 'Merci de décrire dans le champ ci-dessous le problème que vous souhaitez nous faire part :'
    '#required': true
    '#required_error': 'Le champ "Merci de décrire dans le champ ci-dessous le problème que vous souhaitez nous faire part" est obligatoire'
    '#states':
      visible:
        ':input[name="souhaitez_vous_ajouter_un_commentaire_vis_a_vis_de_cette_page"]':
          value: 'Signaler un problème'
  processed_text_02:
    '#type': processed_text
    '#format': full_html
  afin_de_securiser_ce_formulaire_vous_pouvez_choisir_l_une_des_de:
    '#type': radios
    '#title': "Afin de sécuriser ce formulaire, vous pouvez choisir l'une des deux solutions suivantes :"
    '#description': "<p>En sélectionnant Google reCAPTCHA, vous consentez à l'utilisation de cette solution et au traitement des données nécessaire à son fonctionnement.</p>"
    '#options':
      'Captcha État': 'Captcha État -- Solution conseillée par l’université car elle est respectueuse de vos données personnelles.'
      'Google reCAPTCHA': 'Google reCAPTCHA -- une solution qui implique la transmission de certaines données à Google, conformément à sa politique de confidentialité.'
    '#required': true
    '#required_error': 'Merci de sélectionner le captcha que vous souhaitez utiliser'
    '#options__properties': ''
  container_captcha:
    '#type': container
    '#states':
      visible:
        ':input[name="afin_de_securiser_ce_formulaire_vous_pouvez_choisir_l_une_des_de"]':
          value: 'Captcha État'
    captcha:
      '#type': captcha
      '#captcha_type': captchetat/CaptchEtat
  containerrecaptcha:
    '#type': container
    '#states':
      visible:
        ':input[name="afin_de_securiser_ce_formulaire_vous_pouvez_choisir_l_une_des_de"]':
          value: 'Google reCAPTCHA'
    captcha_01:
      '#type': captcha
      '#captcha_type': recaptcha/reCAPTCHA
  actions:
    '#type': webform_actions
    '#title': "Bouton(s) d'envoi"
    '#states':
      visible:
        ':input[name="souhaitez_vous_ajouter_un_commentaire_vis_a_vis_de_cette_page"]':
          filled: true
    '#submit__label': ENVOYER
