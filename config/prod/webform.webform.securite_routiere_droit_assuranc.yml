  submission_label: 'Confirmation inscription -  André Citroën pour l’Histoire : grandeurs d’un destin français'
  submission_exception_message: '<p>Madame, Monsieur,</p><p>Nous avons le plaisir de confirmer votre inscription à l’événement :</p><p>"André Citroën pour l’Histoire : grandeurs d’un destin français"<br><strong>Date :</strong> Mercredi 19 février 2025<br><strong>Heure :</strong> 18h00 à 20h00<br><strong>Lieu </strong>: Amphithéâtre Richelieu, Centre de la Sorbonne<br><strong>Adresse :</strong> 17, rue de la Sorbonne, 75005 Paris</p><p><strong>L’accueil débutera à 17h30</strong>, et l’entrée vous sera accordée sur présentation de cette confirmation.</p><p>Nous vous remercions pour votre intérêt et votre participation à cet hommage historique et culturel.&nbsp;<br>Dans l’attente de vous accueillir, nous vous prions d’agréer, Madame, Monsieur, l’expression de nos salutations distinguées.<br>&nbsp;</p>'
