  confirmation_type: page
  confirmation_url: ''
  confirmation_title: 'Objet : Confirmation de votre inscription à l’événement "André Citroën pour l’Histoire"'
  confirmation_message: '<p>&nbsp;</p><p>Chère/cher [webform_submission:values:prenom] [webform_submission:values:nom],</p><p>&nbsp;</p><p>Nous avons le plaisir de confirmer votre inscription à l’événement :</p><p><strong>"André Citroën pour l’Histoire : grandeurs d’un destin français"</strong><br><strong>Date :</strong> Mercredi 19 février 2025<br><strong>Heure :</strong> 18h00 à 20h00<br><strong>Lieu :</strong> Amphithéâtre Richelieu, Centre de la Sorbonne<br><strong>Adresse :</strong> 17, rue de la Sorbonne, 75005 Paris</p><p>L’accueil sera ouvert à partir de 17h30, et l’accès à l’événement se fera sur présentation de la confirmation qui vous a été transmise par courriel.</p><p>Nous vous remercions pour l’intérêt que vous portez à cet hommage historique et culturel.<br>Dans l’attente de vous accueillir, nous vous prions d’agréer, Chère/cher [webform_submission:values:prenom] [webform_submission:values:nom], l’expression de nos salutations les plus distinguées.</p><p><strong>Communication&nbsp;</strong></p><p>Institut Administration Économique et Sociale</p><p>École de Droit de la Sorbonne</p><p>Email contact : <a href="mailto:communication.iaes@univ-paris1.fr" target="_blank">communication.iaes@univ-paris1.fr</a></p><p>&nbsp;</p>'
