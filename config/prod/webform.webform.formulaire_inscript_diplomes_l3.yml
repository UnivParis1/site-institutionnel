id: formulaire_inscript_diplomes_l3
title: "Formulaire d'inscription à la remise des diplômes 2026 - Licence en droit"
description: "<p>Formulaire d'inscription à la cérémonie de remise des diplômes 2026 -&nbsp;<br>Licence 3</p>"
categories:
  - 'Inscription événement'
elements: |-
  nom:
    '#type': textfield
    '#title': Nom
    '#description': '<p>Nom</p>'
    '#required': true
  prenom:
    '#type': textfield
    '#title': Prénom
    '#required': true
  e_mail:
    '#type': email
    '#title': 'E-mail (Paris 1 Panthéon-Sorbonne)'
    '#description': '<p>Votre e-mail Université Paris 1 Panthéon-Sorbonne</p>'
    '#field_suffix': '@etu.univ-paris1.fr'
    '#required': true
  telephone:
    '#type': tel
    '#title': Téléphone
    '#required': true
  diplome_obtenu:
    '#type': select
    '#title': 'Diplôme obtenu'
    '#options':
      'Licence de droit': 'Licence de droit'
    '#required': true
  je_confirme_ma_participation_a_la_ceremonie_du_vendredi_28_novem:
    '#type': radios
    '#title': 'Je confirme ma participation à la cérémonie du vendredi 23 octobre 2026'
    '#options': yes_no
    '#required': true
    '#options__properties': ''
  nombre_d_accompagnateurs_max_2:
    '#type': webform_mapping
    '#title': 'Nombre d’accompagnateurs (max. 2)'
    '#required': true
    '#source':
      Aucun: Aucun
      1: '1'
      2: '2'
  si_accompagnateurs_merci_d_indiquer_leur_s_nom_s:
    '#type': textfield
    '#title': '👉 Si accompagnateur n°1, merci d’indiquer son nom et prénom :'
    '#multiple': 2
    '#description': '<p>👉 Si accompagnateurs, merci d’indiquer leur(s) nom(s) :</p>'
    '#required': true
  si_accompagnateur_ndeg2_merci_d_indiquer_son_nom_et_prenom:
    '#type': textfield
    '#title': '👉 Si accompagnateur n°2, merci d’indiquer son nom et prénom :'
    '#multiple': 2
    '#description': '<p>👉 Si accompagnateurs, merci d’indiquer leur(s) nom(s) :</p>'
    '#required': true
  information_j_ai_ete_informe_e_que_des_photos_et_ou_videos_pourr:
    '#type': checkbox
    '#title': 'Information : J’ai été informé(e) que des photos et/ou vidéos pourront être prises durant la cérémonie et le cocktail, et qu’elles pourront être diffusées sur les supports de communication et réseaux sociaux de l’IED.'
    '#required': true
