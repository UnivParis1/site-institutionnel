id: 75_carte_de_voeux_2026
title: '75 - Carte de vœux 2026'
description: "<p>Pour permettre l'envoi de carte de voeux électronique pour la nouvelle année.</p>"
categories:
  - Divers
elements: |-
  etape_1:
    '#type': webform_markup
    '#markup': '<h2>Étape 1</h2>'
  votre_prenom_:
    '#type': textfield
    '#title': 'Votre prénom :'
    '#placeholder': Marcel
    '#required': true
    '#default_value': '[cas:attribute:givenname]'
  votre_nom_:
    '#type': textfield
    '#title': 'Votre nom :'
    '#placeholder': Dupont
    '#required': true
    '#default_value': '[cas:attribute:sn]'
  merci_de_le_confirmer:
    '#type': webform_email_confirm
    '#title': 'Votre courriel :'
    '#placeholder': dupont@gmail.com
    '#required': true
    '#default_value': '[current-user:mail]'
    '#confirm__placeholder': 'Merci de la ressaisir pour la confirmer'
  horizontal_rule_02:
    '#type': webform_horizontal_rule
  etape_2:
    '#type': webform_markup
    '#markup': '<h2>Étape 2,&nbsp;ajoutez vos destinataires :</h2>'
  a_combien_de_personne_souhaitez_vous_envoyer_votre_carte_:
    '#type': radios
    '#title': 'À combien de personne souhaitez-vous envoyer votre carte ?'
    '#options':
      'Une personne': 'Une personne'
      'Plusieurs personnes': 'Plusieurs personnes'
    '#required': true
    '#default_value': 'Une personne'
    '#options__properties': ''
  message_explicatif_courriel_multiple:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="a_combien_de_personne_souhaitez_vous_envoyer_votre_carte_"]':
          value: 'Plusieurs personnes'
    '#markup': 'Si vous souhaitez envoyer ce message &agrave; plusieurs personnes, indiquez dans le champ ci-dessous les adresses courriels de ces personnes, s&eacute;par&eacute;es par des virgules.'
  indiquer_les_destinataires:
    '#type': textarea
    '#title': 'Indiquer les courriels des destinataires :'
    '#placeholder': 'dupont@gmail.com, stephlomos@laposte.net, prenom.nom@univ-paris1.fr'
    '#states':
      visible:
        ':input[name="a_combien_de_personne_souhaitez_vous_envoyer_votre_carte_"]':
          value: 'Plusieurs personnes'
  a_qui_voulez_vous_envoyer_votre_carte_:
    '#type': textfield
    '#title': 'Indiquez le courriel du destinataire :'
    '#placeholder': adupont@laposte.net
    '#states':
      visible:
        ':input[name="a_combien_de_personne_souhaitez_vous_envoyer_votre_carte_"]':
          value: 'Une personne'
    '#required': true
  horizontal_rule:
    '#type': webform_horizontal_rule
  etape_3:
    '#type': webform_markup
    '#markup': '<h2>Étape 3, personnalisez votre message :</h2>'
  container:
    '#type': container
    '#format': container
    message_explicatif_limitation_caractere:
      '#type': webform_markup
      '#markup': 'Indiquez votre message dans le champ ci-dessous. Pour des raisons de mise en forme, celui-ci est limit&eacute; &agrave; 300 caract&egrave;res.'
    votre_message_de_voeux:
      '#type': textarea
      '#title': 'Votre message de vœux'
      '#required': true
      '#required_error': 'Vous devez indiquer un message.'
      '#counter_type': character
      '#counter_maximum': 300
      '#counter_maximum_message': '%d caractères restants.'
  image_voeux_2022:
    '#type': webform_attachment_url
    '#title': 'Image Voeux 2023'
    '#filename': Carte-de-voeux-2023.png
    '#download': true
    '#url': 'https://com-web.univ-paris1.fr/fileadmin/Service-com/2023/Voeux2023/Carte-de-voeux-2023.png'
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#states_clear': false
    '#submit__label': Envoyer
    '#reset_hide': true
    '#reset__label': Effacer
    '#update_hide': true
