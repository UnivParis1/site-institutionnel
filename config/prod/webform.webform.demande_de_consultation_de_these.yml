id: demande_de_consultation_de_these
title: '10 - Demande de consultation de thèse'
description: "<p>Arborescence : Menu direction &gt; Services<br><br>Lien vers ce formulaire depuis la page <em>Bibliothèque Pierre Mendès France</em> &gt; rubrique <em>Conditions d'accès et de prêt</em></p>"
categories:
  - Contact
elements: |-
  coordonnees:
    '#type': webform_section
    '#title': Coordonnées
    nom_prenom:
      '#type': webform_name
      '#title': 'Nom, prénom'
      '#required': true
      '#title__access': false
      '#first__title': Prénom
      '#first__required': true
      '#middle__access': false
      '#last__title': Nom
      '#last__required': true
      '#suffix__access': false
      '#degree__access': false
    telephone:
      '#type': tel
      '#title': Téléphone
      '#required': true
    courriel:
      '#type': email
      '#title': Courriel
      '#required': true
    je_ne_suis_pas_etudiant_es_a_l_universite_paris_1_pantheon_sorbo:
      '#type': checkbox
      '#title': "Je ne suis pas étudiant·es à l'université Paris 1 Panthéon-Sorbonne"
      '#description': '<p>Si vous êtes étudiant·es à l''université Paris 1, <strong>vous n''avez pas besoin</strong> de remplir ce formulaire. Vous pouvez vous présenter à tout moment dans les bibliothèques Hélène-Ahrweiler, Jean-Claude-Colliard ou Pierre-Mendès-France ou passer par <a href="https://theses.fr/?domaine=theses" target="_blank" data-entity-type="external">theses.fr</a> pour les documents électroniques.</p>'
      '#required': true
  references_de_la_these:
    '#type': webform_section
    '#title': 'Références de la thèse'
    titre_de_la_these:
      '#type': textfield
      '#title': 'Titre de la thèse'
      '#required': true
    auteur_de_la_these:
      '#type': textfield
      '#title': 'Auteur de la thèse'
      '#required': true
    cote:
      '#type': textfield
      '#title': Cote
      '#required': true
  date_souhaitee_pour_le_rendez_vous:
    '#type': webform_section
    '#title': 'Modalités de rendez-vous'
    choisissez_la_bibliotheque_que_vous_souhaitez_frequenter:
      '#type': select
      '#title': 'Dans quelle bibliothèque se trouve la thèse qui vous intéresse ?'
      '#options':
        'Bibliothèque Hélène-Ahrweiler (SHS)': 'Bibliothèque Hélène-Ahrweiler (SHS)'
        'Bibliothèque Jean-Claude-Colliard (droit)': 'Bibliothèque Jean-Claude-Colliard (droit)'
        'Bibliothèque Pierre-Mendès-France (économie)': 'Bibliothèque Pierre-Mendès-France (économie)'
      '#required': true
      '#required_error': 'Vous devez choisir une des deux bibliothèque'
    choisir_une_date:
      '#type': date
      '#title': 'Choisissez une date (délai minimum de 48h)'
      '#required': true
      '#date_days':
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
        - '6'
    creneau_souhaite:
      '#type': radios
      '#title': 'Choisissez le créneau souhaité'
      '#options':
        Matin: Matin
        Après-midi: Après-midi
      '#required': true
      '#options__properties': ''
  terms_of_service:
    '#type': webform_terms_of_service
    '#title': "J'accepte les {conditions de service}."
    '#required': true
    '#terms_content': '<span class="field-prefix">En soumettant ce formulaire, j&#39;accepte que les informations saisies soient exploit&eacute;es dans le cadre de ma demande de consultation de th&egrave;se.</span>'
  captcha:
    '#type': captcha
  actions:
    '#type': webform_actions
    '#title': "Bouton(s) d'envoi"
    '#submit__label': 'Envoyer la demande'
