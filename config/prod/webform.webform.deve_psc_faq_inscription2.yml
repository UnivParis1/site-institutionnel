id: deve_psc_faq_inscription2
title: 'DEVE PSC - FAQ-inscription2'
description: '<p>Informations relatives à des situations particulières des étudiants pour leur inscriptions administratives</p>'
categories:
  - 'FAQ DEVE IA'
elements: |-
  ma_situation_est_la_suivante:
    '#type': radios
    '#title': 'Ma situation est la suivante : '
    '#options':
      "Je dois m'inscrire sur IA-primo ou IA-Reins. comment trouver mon identifiant de préinscription ? ": "Je dois m'inscrire sur IA-primo ou IA-Reins. <br />Comment trouver mon identifiant de préinscription ?"
      "Je suis un étudiant en mobilité sortante (semestre à l'étranger)": "Je suis un étudiant en mobilité sortante (semestre à l'étranger).  <br />Dois-je faire une inscription administrative (IA) à Paris 1 Panthéon-Sorbonne ?"
      "Je n'ai pas la nationalité française ni ne suis membre de l'UE": "Je n'ai pas la nationalité française ni ne suis membre de l'UE.  <br />L'application des droits différenciés me concerne-t-elle ?"
      "J'ai un BAC extra-communautaire ou un diplôme hors UE": "J'ai un BAC extra-communautaire ou un diplôme hors UE.  <br />Comment faire reconnaître mon diplôme ?"
      'Je suis auditeur libre': 'Je suis auditeur libre.  <br />Comment faire mon inscription ?'
      "Une fois que j'ai procédé à mon inscription en ligne, ": "Une fois que j'ai procédé à mon inscription en ligne,  <br />quelles pièces sont à transmettre pour valider mon Inscription administrative ?"
      'Je dois payer mon inscription': "Je dois payer mon inscription.  <br />Comment puis-je m'acquitter de mes frais de scolarité ? "
      "Je suis en contrat d'apprentissage ou en contrat de professionnalisation": "Je suis en contrat d'apprentissage ou en contrat de professionnalisation.  <br />Dois-je payer l'inscription ? "
      'Je suis boursier sur critères sociaux': "Je suis boursier sur critères sociaux.  <br />Dois-je payer l'inscription ? "
      'Je rencontre des difficultés à payer mes frais de scolarité': "Je rencontre des difficultés à payer mes frais de scolarité.  <br />Puis-je passer en commission d'exonération ? "
      "J'ai une question sur la Césure ": "J'ai une question sur la Césure "
      'Je suis en Classe Préparatoire (CPGE)': 'Je suis en Classe Préparatoire (CPGE)'
    '#options__properties': ''
  cherche_opi:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="ma_situation_est_la_suivante"]':
          value: "Je dois m'inscrire sur IA-primo ou IA-Reins. comment trouver mon identifiant de préinscription ? "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p style="margin-left:15px;margin-top:3px;"><span id="ui-id-92">Votre <strong>identifiant de préinscription est indiqué sur votre autorisation d''inscription.</strong></span></p><ul><li data-list-item-id="e30ca22f1ac9df50410270d41c2ec6740"><p style="margin-left:15px;margin-top:3px;"><span id="ui-id-92">Si vous avez effectué votre candidature sur Parcoursup, vous devez préfixer votre identifiant par :</span></p><ul><li style="margin-bottom:11px;" data-list-item-id="ed81a2b7cfeb9272d02ba20acc2d63535"><span id="ui-id-92">P26 si celui-ci comporte 7 caractères</span></li><li style="margin-bottom:11px;" data-list-item-id="ebe1abf30b1790ba53ed6439200b8da46"><span id="ui-id-92">P260 si celui-ci comporte 6 caractères (0 = zéro)</span></li></ul></li><li data-list-item-id="e5e99806bcacd0b5e84769cf90a2bfaf2"><p style="margin-left:15px;margin-top:3px;"><span id="ui-id-92">Si vous avez effectué votre candidature sur Mon Master et que votre identifiant commence par CAND,</span><br><span id="ui-id-92">vous devez remplacer CAND par M6.</span></p></li><li data-list-item-id="e69e78bf2a1ff7dfdab6099efe51a0449"><p style="margin-left:15px;margin-top:3px;"><span id="ui-id-92">Si vous avez effectué votre candidature sur ECandidat,</span><br><span id="ui-id-92">vous devez préfixer votre identifiant par EC.</span></p></li><li data-list-item-id="efbad748a45f8908c4fb924b14a052094"><p style="margin-left:15px;margin-top:3px;"><span id="ui-id-92">Si vous avez effectué votre candidature sur Moveonline,</span><br><span id="ui-id-92">vous devez taper votre identifiant commençant par MV tel qu''il vous a été communiqué par courriel.</span></p></li></ul><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e810b6f13e7962a077663836a819d7c75"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e3b9a11c7b8aaa05c8f4916e6f2c81166"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  mobilite_sortante:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="ma_situation_est_la_suivante"]':
          value: "Je suis un étudiant en mobilité sortante (semestre à l'étranger)"
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p><strong>Oui</strong>. Je retrouve tous les détails en cliquant sur le lien suivant :&nbsp;</p><p><a href="https://international.pantheonsorbonne.fr/venir-paris-1-pantheon-sorbonne/etudiant-en-mobilite-individuelle" target="_blank" rel="noreferrer noopener">https://international.pantheonsorbonne.fr/venir-paris-1-pantheon-sorbonne/etudiant-en-mobilite-individuelle&nbsp;</a></p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="ec8d2dd4a9a8e5f624d05a998b44476dd"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e769b4b824b763df6f701ef5efe1c0d00"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  extra_comm:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="ma_situation_est_la_suivante"]':
          value: "Je n'ai pas la nationalité française ni ne suis membre de l'UE"
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Je peux trouver toutes les réponses à mes questions sur la page web suivante :&nbsp;</p><p><a href="https://international.pantheonsorbonne.fr/droits-dinscription-differencies" target="_blank" rel="noreferrer noopener">https://international.pantheonsorbonne.fr/droits-dinscription-differencies</a></p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="eba53d78d3900cf88dbd03ecc94e74ab8"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="eca991bf1c7d5c48ebc52a30510875778"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-ia/faq-extra-com" rel="noopener noreferrer">NON</a></li></ul>'
  enic_naric:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="ma_situation_est_la_suivante"]':
          value: "J'ai un BAC extra-communautaire ou un diplôme hors UE"
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p><strong>Pour faire reconnaître mon niveau je dois passer par la plateforme ENIC NARIC</strong>* via le lien suivant :&nbsp;</p><p><a href="https://www.france-education-international.fr/hub/reconnaissance-de-diplomes?langue=fr">https://www.france-education-international.fr/hub/reconnaissance-de-diplomes?langue=fr</a></p><p>*<em>sauf pour les étudiants entrants ERASMUS et CAMPUS FRANCE</em></p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="eda1a79fee98b2b66b5c6439db16877d2"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="efd4769a927d46e727fbb7a7dd79f2d17"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  ia_auditeur_libre:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="ma_situation_est_la_suivante"]':
          value: 'Je suis auditeur libre'
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Je dois faire ma candidature sur<strong> </strong><a href="https://ecandidat.univ-paris1.fr/ecandidat/#!accueilView"><strong>eCandidat</strong></a> via le lien suivant :&nbsp;<a href="https://ecandidat.univ-paris1.fr/ecandidat/#!accueilView" target="_blank" rel="noreferrer noopener">https://ecandidat.univ-paris1.fr/ecandidat/#!accueilView</a></p><p><strong>La seule pièce justificative à fournir pour valider mon inscription auprès de l''université est ma pièce d''identité</strong>. Les candidatures sont ouvertes de la fin août à la toute fin de septembre (vérifiez les dates précises sur <a href="https://ecandidat.univ-paris1.fr/ecandidat/#!accueilView" target="_blank" rel="noreferrer noopener">eCandidat</a> ou sur le<a href="https://www.pantheonsorbonne.fr/inscription/inscription-administrative" target="_blank" rel="noreferrer noopener"> calendrier des inscriptions</a>).&nbsp;</p><p>Si l''année précédente j''étais déjà auditeur libre (inscription sans interruption) je n''ai pas besoin de faire de candidature, je peux m''inscrire directement directement depuis<a href="http://reins.univ-paris1.fr/reins/" target="_blank" rel="noreferrer noopener"> IA Reins</a> à partir de la dernière semaine de juin.&nbsp;</p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e39085f97507ef32edf0d1c19ad87bb76"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="ed4c5a8003b2e73d8ed2bda9ee5144b90"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  pj:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="ma_situation_est_la_suivante"]':
          value: "Une fois que j'ai procédé à mon inscription en ligne, "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p><strong>Les différentes pièces à transmettre sont</strong> :</p><ul><li data-list-item-id="eff3c13eaef0090066edd546fd4df1676">Ma pièce d''identité</li><li data-list-item-id="e1aa28b29b3abd1743a8eec0da8948d97">Mon relevé de notes du BAC si c''est une première inscription (sauf auditeur libre, DAEU, capacité en droit et DU Droit des entreprises en difficulté)</li><li data-list-item-id="e6a04b769812ac56174fdbcfea33b448d">Ma notification de bourse si je suis boursier</li><li data-list-item-id="e2da4ca84fa526d5e6dfab76689e1562f">Mon contrat d''apprentissage (notice CERFA) si je suis en alternance</li><li data-list-item-id="ea1a2768ce44b5c28d59db1ca43f0808f">Mon certificat de journée d''appel ou recensement (si je suis de nationalité française et âgé de moins de 25 ans)</li><li data-list-item-id="ea82c678a833dba82f8d6d2db2911b6af">Mon relevé de notes ou attestation de réussite de L3 pour une inscription en Master.</li></ul><p>Si je suis <strong>en doctorat, j''ajoute</strong>, le cas échéant :&nbsp;</p><ul><li data-list-item-id="e3dcd189e140442586ec5f493091603a5">Mon contrat de doctorant Paris 1</li><li data-list-item-id="e516cbe563882a116971bb2ee00e517b7">Mon contrat d''ATER de Paris 1</li><li data-list-item-id="e78f300686da514cb7ac80840a85c1043">Ma convention de Cotutelle + certificat de scolarité de l''établissement partenaire (ou autre document officiel attestant du paiement des frais de scolarité)</li></ul><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e4b1c40eb87f1152ebd9110c00a1daf3c"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e8b4f96e440c97e15fd809b3b6bec6f0e"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  je_ne_sais_pas_comment_payer_mes_frais_de_scolarite_ma_situation:
    '#type': radios
    '#title': 'Je ne sais pas comment payer mes frais de scolarité. Ma situation est la suivante :  '
    '#options':
      "Je n'ai pas encore procédé à mon inscription administrative (= au diplôme) ": "Je n'ai pas encore procédé à mon inscription administrative (= au diplôme) "
      "J'ai effectué mon inscription administrative (via IA-Primo ou IA-réins) ": "J'ai effectué mon inscription administrative (via IA-Primo ou IA-réins) "
      'Je souhaite simplement savoir quels sont les moyens de paiement acceptés ': 'Je souhaite simplement savoir quels sont les moyens de paiement acceptés '
      'Je souhaite connaître le montant des frais à payer ': 'Je souhaite connaître le montant des frais à payer '
      "Les frais différenciés (=tarifs spécifiques aux non-membres de l'UE) me concernent-ils ? ": "Les frais différenciés (=tarifs spécifiques aux non-membres de l'UE) me concernent-ils ? "
      "Quand dois-je m'acquitter de la Contribution Vie Etudiante et de Campus (CVEC) et où ? ": "Quand dois-je m'acquitter de la Contribution Vie Etudiante et de Campus (CVEC) et où ? "
    '#states':
      visible-slide:
        ':input[name="ma_situation_est_la_suivante"]':
          value: 'Je dois payer mon inscription'
    '#options__properties': ''
  options_de_paiement:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="je_ne_sais_pas_comment_payer_mes_frais_de_scolarite_ma_situation"]':
          value: "Je n'ai pas encore procédé à mon inscription administrative (= au diplôme) "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p><strong>Je peux procéder au règlement </strong>(au choix) :</p><ul><li data-list-item-id="e9d925727aa1ea3f36afe08773d48cfa5">à la fin de mon inscription en ligne,</li><li data-list-item-id="e1642f5551ce1d133ce24c7c59f4a73ea">en demandant un lien de paiement à <a href="mailto:regiepmf@univ-paris1.fr">regiepmf@univ-paris1.fr</a> <em>a posteriori</em></li><li data-list-item-id="e3fe4c514cd56bc562e7950a9d370ba62">je peux envoyer un chèque à l''ordre : "<em>agent comptable université Paris 1</em>" avec mon <strong>n° d''étudiant et&nbsp; NOM au dos du chèque</strong>.</li></ul><p><u>A noter</u> : il n''y a <strong>pas </strong>de possibilité de payer en espèces</p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e02fbce772fb0c40f957efca8712a48f5"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="eeadbf7f04e685c5657837984dc743435"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  je_me_suis_inscrit_en_ligne_et_ma_situation_est_la_suivante:
    '#type': radios
    '#title': 'Je me suis inscrit en ligne, et ma situation est la suivante :  '
    '#options':
      "Je n'ai pas réussi à finaliser le paiement à la fin de mon inscription, comment faire ? ": "Je n'ai pas réussi à finaliser le paiement à la fin de mon inscription, comment faire ? "
      'Je rencontre des difficultés de paiement, puis-je payer en plusieurs fois ? ': 'Je rencontre des difficultés de paiement, puis-je payer en plusieurs fois ? '
      "J'avais choisi le paiement en plusieurs fois mais mon compte n'était pas suffisamment approvisionné et/ou ma carte est en opposition ou arrivée à échance et/ou l'un des paiements fractionnés n'a pas été honoré. ": "J'avais choisi le paiement en plusieurs fois mais mon compte n'était pas suffisamment approvisionné et/ou ma carte est en opposition ou arrivée à échance et/ou l'un des paiements fractionnés n'a pas été honoré. "
      "Je souhaite demander le remboursement des frais d'inscription ou d'un trop-perçu. ": "Je souhaite demander le remboursement des frais d'inscription ou d'un trop-perçu. "
      "Je souhaite annuler mon inscription et demander le remboursement des frais d'inscription. ": "Je souhaite annuler mon inscription et demander le remboursement des frais d'inscription. "
    '#states':
      visible-slide:
        ':input[name="je_ne_sais_pas_comment_payer_mes_frais_de_scolarite_ma_situation"]':
          value: "J'ai effectué mon inscription administrative (via IA-Primo ou IA-réins) "
    '#options__properties': ''
  paiement_hors_ia:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="je_me_suis_inscrit_en_ligne_et_ma_situation_est_la_suivante"]':
          value: "Je n'ai pas réussi à finaliser le paiement à la fin de mon inscription, comment faire ? "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p><strong>Si je n''ai pas pu finaliser le paiement en ligne, mon inscription est alors en attente de paiement.</strong></p><p>Il est impossible de revenir en arrière, dès lors, <strong>j''ai le choix entre 2 solutions</strong> :&nbsp;</p><ul><li data-list-item-id="e3b0c2737333b77cad9120ff55dc1b127">en demandant un lien de paiement à <a href="mailto:regiepmf@univ-paris1.fr">regiepmf@univ-paris1.fr</a></li><li data-list-item-id="e1e1963520abcf5718dfc531f4fc98069">je peux envoyer un chèque à l''ordre : "<em>agent comptable université Paris 1</em>" avec mon <strong>n° d''étudiant et&nbsp; NOM</strong> au dos du chèque.</li></ul><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e9e827cd62fa7bb43934fd7db09a4bb1d"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e25849a86b6b5d241e589d41d0999bfdf"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  paiement_en_xn:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="je_me_suis_inscrit_en_ligne_et_ma_situation_est_la_suivante"]':
          value: 'Je rencontre des difficultés de paiement, puis-je payer en plusieurs fois ? '
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p><strong>Le paiement en 3 fois est impossible sur place, uniquement via le web par carte bancaire</strong> et ce jusqu''au <strong>15 octobre </strong>de l''année en cours).</p><p><br><em>A noter </em>: <em>sur mon espace bancaire personnel, la somme affichée correspond au montant final total que j''aurai payé à l''issue des 3 paiement. Même si ce n''est pas visible, cette somme sera bien automatiquement divisée par trois (si j''ai préalablement choisi cette option).</em></p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e88ba45a3c5cccbd0195b627a0e3c9800"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e74e90e863111c7ff2633fa01df1bbdb8"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  defaut_de_paiement:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="je_me_suis_inscrit_en_ligne_et_ma_situation_est_la_suivante"]':
          value: "J'avais choisi le paiement en plusieurs fois mais mon compte n'était pas suffisamment approvisionné et/ou ma carte est en opposition ou arrivée à échance et/ou l'un des paiements fractionnés n'a pas été honoré. "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p><strong>Je serai contacté par la comptabilité qui m''enverra un lien de paiement afin de régulariser ma situation</strong> et enlever mon interdit qui aura été mis sur mon inscription.</p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e4cc88ed7e9e1bdce51608f9c1575023a"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e970be7577f58440c800e8652df4c5999"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  demande_de_remboursement:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="je_me_suis_inscrit_en_ligne_et_ma_situation_est_la_suivante"]':
          value: "Je souhaite demander le remboursement des frais d'inscription ou d'un trop-perçu. "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Je peux trouver <strong>les conditions et modalités de remboursement des frais d''inscription administrative</strong> sur la page de l''ENT/intranet suivante :&nbsp;</p><p><a href="https://ent-intranet.pantheonsorbonne.fr/remboursement-des-droits-universitaires-des-etudiants-boursiers-et-autres">https://ent-intranet.pantheonsorbonne.fr/remboursement-des-droits-universitaires-des-etudiants-boursiers-et-autres</a></p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="ed7f2fefcd93d61b943f3839cae16bd3a"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e527cb346ad34f3476afc329668f6c56b"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  annulation_avec_remboursement:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="je_me_suis_inscrit_en_ligne_et_ma_situation_est_la_suivante"]':
          value: "Je souhaite annuler mon inscription et demander le remboursement des frais d'inscription. "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Je peux trouver <strong>les conditions et modalités d''annulation et de remboursement des frais d''inscription administrative sur la page de l''ENT/intranet</strong> suivante :&nbsp;</p><p><a href="https://ent-intranet.pantheonsorbonne.fr/annulation-dinscription" target="_blank" rel="noreferrer noopener">https://ent-intranet.pantheonsorbonne.fr/annulation-dinscription</a></p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="eaaaa2c132788a237843a15d4052f6213"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="ebf5d5928e4afefd6747b6c0eb47d8d4e"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  moyens_de_paiement:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="je_ne_sais_pas_comment_payer_mes_frais_de_scolarite_ma_situation"]':
          value: 'Je souhaite simplement savoir quels sont les moyens de paiement acceptés '
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p><strong>Les moyens de paiement acceptés par l''université Paris 1 Panthéon-Sorbonne sont :&nbsp;</strong></p><ul><li data-list-item-id="e53d9b6444b29a08a522927f384faf1ad">le paiement en ligne (par carte bancaire)</li><li data-list-item-id="eb12a1caa8e6f882fb953dbb610f4f4e6">le paiement sur place par carte bancaire (bureau C11.06 au centre PMF, les Lundi / Mercredi / Jeudi / Vendredi 9h15-12h15 et 13h30-16h)</li><li data-list-item-id="ebc3424c091ce4e3743503da59c6872c2">le paiement par chèque*&nbsp;à l''ordre : "<em>agent comptable université Paris 1</em>" avec mon <strong>n° d''étudiant et&nbsp; NOM</strong> au dos du chèque.</li></ul><p>Le paiement en <strong>espèces </strong>n''est <strong>pas possible</strong>.</p><p>*<em>lors de mon inscription en ligne, je peux choisir le paiement par chèque si je souhaite différer légèrement le paiement de mes frais, ou si, par exemple, je suis susceptible d''être boursier sur critères sociaux mais que je n''ai pas encore de notification provisoire ou définitive de bourse comme justificatif d''exonération.</em></p><p><em><strong>Attention, à partir de juin 2027, il ne sera plus du tout possible de payer par chèque</strong></em></p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e1e2c51e5aa77f195aa914397751a3a9b"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="ef571e70430695f64594c7e1d9aa71975"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  tarifs_ia:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="je_ne_sais_pas_comment_payer_mes_frais_de_scolarite_ma_situation"]':
          value: 'Je souhaite connaître le montant des frais à payer '
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Je peux trouver <strong>les tarifs des frais d''inscription administrative sur la page suivante</strong> :&nbsp;</p><p><a href="https://www.pantheonsorbonne.fr/inscription/frais-dinscription" target="_blank" rel="noreferrer noopener">https://www.pantheonsorbonne.fr/inscription/frais-dinscription</a></p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e65dc15885c1bdbda6744d4cb15ae510a"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e60d4aca56bce9003877a024cdb348a88"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-contact" rel="noopener noreferrer">NON</a></li></ul>'
  extra_comm_duplicata:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="je_ne_sais_pas_comment_payer_mes_frais_de_scolarite_ma_situation"]':
          value: "Les frais différenciés (=tarifs spécifiques aux non-membres de l'UE) me concernent-ils ? "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Je peux trouver <strong>toutes les réponses à mes questions sur la page web suivante</strong> :&nbsp;</p><p><a href="https://international.pantheonsorbonne.fr/droits-dinscription-differencies" target="_blank" rel="noreferrer noopener">https://international.pantheonsorbonne.fr/droits-dinscription-differencies</a></p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e2cf86e986c070062f3ec10ca24d8050e"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e909c627f6e4cc0e96f8afafe81f929e1"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-ia/faq-extra-com" rel="noopener noreferrer">NON</a></li></ul>'
  cvec:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="je_ne_sais_pas_comment_payer_mes_frais_de_scolarite_ma_situation"]':
          value: "Quand dois-je m'acquitter de la Contribution Vie Etudiante et de Campus (CVEC) et où ? "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p><strong>La CVEC est indépendante des frais d''inscription de l''université, même si elle reste obligatoire pour pouvoir s''inscrire.</strong> Je&nbsp; peux trouver les informations concernant la CVEC sur<a href="https://cvec.etudiant.gouv.fr/" target="_blank" rel="noreferrer noopener"> la page WEB du CROUS</a> dédiée. <strong>En cas de problème l''université ne pourra pas le résoudre.</strong> Il faut impérativement et exclusivement passer par le CROUS.</p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e6d67968eb645e6cb1999e61dd1bf67d0"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e9f2c8e188852d86ee31a61b36bb46f57"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-ia/faq-extra-com" rel="noopener noreferrer">NON</a></li></ul>'
  frais_apprentissage:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="ma_situation_est_la_suivante"]':
          value: "Je suis en contrat d'apprentissage ou en contrat de professionnalisation"
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p><strong>Non</strong>.&nbsp;Dans le cadre d''une inscription en contrat d''apprentissage ou de professionnalisation, je n''ai pas à payer les frais d''inscription administrative.&nbsp;</p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e4a0cfd58ad96de087a53bc5f5c577995"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="eb57141a33408bc128abd161e77216c11"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-ia/faq-extra-com" rel="noopener noreferrer">NON</a></li></ul>'
  frais_boursiers:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="ma_situation_est_la_suivante"]':
          value: 'Je suis boursier sur critères sociaux'
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Non.&nbsp;En tant que <strong>boursier </strong>sur critères sociaux (<strong>CROUS</strong>),&nbsp;je n''ai pas à payer les frais d''inscription administrative.&nbsp;</p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="eda2f63018c3c9c0d4df4a6e4375e6603"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="eea3e7e5880d1ef82111d075c54e6de4e"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-ia/faq-extra-com" rel="noopener noreferrer">NON</a></li></ul>'
  commission_exoneration:
    '#type': webform_markup
    '#states':
      visible-slide:
        ':input[name="ma_situation_est_la_suivante"]':
          value: 'Je rencontre des difficultés à payer mes frais de scolarité'
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Je peux <strong>faire une demande d''exonération des frais d''inscription sur mon ENT/intranet</strong>, à l''adresse suivante :&nbsp;</p><p><a href="https://ent-intranet.pantheonsorbonne.fr/demande-dexonerations-des-frais-dinscription">https://ent-intranet.pantheonsorbonne.fr/demande-dexonerations-des-frais-dinscription</a></p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="ef9b93781be942bbcb6fee6de25b0efd8"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e0d4698b3feb4751a38b7ccd492ec1f77"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-ia/faq-extra-com" rel="noopener noreferrer">NON</a></li></ul>'
  concernant_la_cesure:
    '#type': radios
    '#title': 'Concernant la césure :  '
    '#options':
      'Je souhaite déposer un dossier de demande de césure ': 'Je souhaite déposer un dossier de demande de césure '
      "J'ai besoin d'information pour une demande de césure ": "J'ai besoin d'information pour une demande de césure "
      "Je suis en césure, comment dois-je faire pour me réinscrire l'année prochaine ? ": "Je suis en césure, comment dois-je faire pour me réinscrire l'année prochaine ? "
    '#states':
      visible-slide:
        ':input[name="ma_situation_est_la_suivante"]':
          value: "J'ai une question sur la Césure "
    '#options__properties': ''
  demande_de_cesure:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="concernant_la_cesure"]':
          value: 'Je souhaite déposer un dossier de demande de césure '
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Je dois contacter<a href="https://www.pantheonsorbonne.fr/formation/departements" target="_blank" rel="noreferrer noopener"> mon département (École,UFR ou institut)</a> afin de <strong>faire valider mon projet de césure</strong>.</p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="ee057c69605bf1fa83f339324afdd0c46"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e8a4a8ed001918b3953bf8c2ef9927e7e"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-ia/faq-extra-com" rel="noopener noreferrer">NON</a></li></ul>'
  info_cesure:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="concernant_la_cesure"]':
          value: "J'ai besoin d'information pour une demande de césure "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p><strong>Même en année de césure, je dois m''assurer d''avoir bien effectué mon inscription administrative, car elle est obligatoire.&nbsp;</strong></p><p>Je peux trouver l''ensemble des informations concernant la césure sur la page suivante :&nbsp;</p><p><a href="https://www.pantheonsorbonne.fr/periode-cesure-0" target="_blank" rel="noreferrer noopener">https://www.pantheonsorbonne.fr/periode-cesure-0</a></p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e14fd1119a0048b3b31a5e79384f1e591"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="eaa30c91a91af989e81251bdb7d4fcd32"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-ia/faq-extra-com" rel="noopener noreferrer">NON</a></li></ul>'
  reinscription_apres_cesure:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="concernant_la_cesure"]':
          value: "Je suis en césure, comment dois-je faire pour me réinscrire l'année prochaine ? "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Je dois contacter <a href="https://www.pantheonsorbonne.fr/formation/departements" target="_blank" rel="noreferrer noopener">le secrétariat pédagogique de mon département</a> pour obtenir une <strong>autorisation d''inscription</strong> afin de me réinscrire dans cette formation l''année prochaine.</p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="ed87da409358f9c44dfbf67129a551895"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e3ff000e8fb68a7bf776e62142df49ae1"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-ia/faq-extra-com" rel="noopener noreferrer">NON</a></li></ul>'
  concernant_mon_inscription_en_cumulatif_a_paris_1_il_est_import:
    '#type': radios
    '#title': '  Concernant mon inscription en cumulatif à Paris 1, je souhaite savoir :'
    '#description': "<p>&nbsp;</p><p><strong><u>ATTENTION </u></strong>: il est important de savoir que la procédure pour s'inscrire en 2è année (cumulatif) :</p><p>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; - est différente de la 1ère année,&nbsp;&nbsp;</p><p>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; - n'est PAS automatique.</p>"
    '#options':
      'Quelles sont les étapes pour procéder à une première inscription en CPGE cumulatif ?': 'Quelles sont les étapes pour procéder à une première inscription en CPGE cumulatif ?'
      'Quelles sont les étapes pour procéder à une réinscription en CPGE ?': 'Quelles sont les étapes pour procéder à une réinscription en CPGE ?'
      "Si je dois payer des frais différenciés, car je ne suis pas membre de l'UE ": "Si je dois payer des frais différenciés, car je ne suis pas membre de l'UE "
    '#states':
      visible-slide:
        ':input[name="ma_situation_est_la_suivante"]':
          value: 'Je suis en Classe Préparatoire (CPGE)'
    '#options__properties': ''
  cpge_l1:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="concernant_mon_inscription_en_cumulatif_a_paris_1_il_est_import"]':
          value: 'Quelles sont les étapes pour procéder à une première inscription en CPGE cumulatif ?'
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p>Je peux trouver toutes les informations dont j''ai besoin sur le lien suivant dans la rubrique "<strong>autres situations</strong>" -&gt; "<strong>étudiant en classe préparatoire</strong>":&nbsp;</p><p><a href="https://www.pantheonsorbonne.fr/inscription/premiere-inscription" target="_blank" rel="noreferrer noopener">https://www.pantheonsorbonne.fr/inscription/premiere-inscription</a></p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="eb31a47ef2a3cdd04fee9199be115a84b"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="ee82c87be1992958fe60c593085d6b109"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-ia/faq-extra-com" rel="noopener noreferrer">NON</a></li></ul>'
  cpge_reinscription:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="concernant_mon_inscription_en_cumulatif_a_paris_1_il_est_import"]':
          value: 'Quelles sont les étapes pour procéder à une réinscription en CPGE ?'
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p><strong>Pour passer en 2e année de Licence cumulative</strong>, je dois obligatoirement passer par <a href="https://ecandidat.univ-paris1.fr/ecandidat/connect#!accueilView">ECandidat</a>, courant juin, et choisir la formation "non-diplômante" (sauf exception sur quelques rares formations de Droit et d''Economie), dédiée à la CPGE.</p><p>Je peux trouver toutes les informations dont j''ai besoin sur le lien suivant :&nbsp;</p><p><a href="https://www.pantheonsorbonne.fr/inscription/reinscription" target="_blank" rel="noreferrer noopener">https://www.pantheonsorbonne.fr/inscription/reinscription</a></p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e66e4b2ec2eb75ccf9dd8b5ba94ce9316"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e20d5b0cdc7a2dcaf93c36dc08a1cdb90"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-ia/faq-extra-com" rel="noopener noreferrer">NON</a></li></ul>'
  cpge_extracomm:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="concernant_mon_inscription_en_cumulatif_a_paris_1_il_est_import"]':
          value: "Si je dois payer des frais différenciés, car je ne suis pas membre de l'UE "
    '#wrapper_attributes':
      class:
        - faqtextreponse
    '#markup': '<p><strong>Non</strong>, en tant qu''élève CPGE inscrit à Paris 1 Panthéon-Sorbonne, <strong>je n''aurai pas à payer les frais différenciés en raison de ma nationalité hors UE.&nbsp;</strong></p><p>Je dois pour cela <strong>m''assurer auprès de mon lycée qu''une convention a bien été signée entre l''établissement scolaire et l''université.</strong></p><hr><p>J''ai trouvé les informations dont j''avais besoin ?</p><ul class="groupeboutonavis"><li data-list-item-id="e226f68304cd4fd3fb9fc65b00f5d32b7"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription" rel="noopener noreferrer">OUI</a></li><li data-list-item-id="e33808149e87866a21b20d31f661b40b7"><a class="boutonavis" href="https://www.pantheonsorbonne.fr/inscription/faq-inscription/faq-ia/faq-extra-com" rel="noopener noreferrer">NON</a></li></ul>'
