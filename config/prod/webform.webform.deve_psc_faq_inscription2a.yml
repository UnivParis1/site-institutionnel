elements: |-
  situation_extra_comm:
    '#type': checkboxes
    '#title': "En tant qu'étudiant extra-communautaire (= non membre de l'UE), ma situation est la suivante :"
    '#description': '<p>&nbsp;</p><p><strong>Il est possible de cocher toutes les cases qui s''appliquent à votre situation&nbsp;</strong></p><p>*Retrouvez la <a href="https://www.un.org/development/desa/dpad/wp-content/uploads/sites/45/publication/ldc_list.pdf">liste des pays concernés</a> sur ce lien : <a href="https://www.un.org/ldcportal/fr">https://www.un.org/ldcportal/fr</a></p>'
    '#help_title': "Cochez ce qui s'applique"
    '#help': '<p>Cochez autant de cases qui correspondent à votre situation</p>'
    '#options':
      "J'ai payé mes impôts en France les 2 dernières années précédant mon année d'inscription": "J'ai payé mes impôts en France les 2 dernières années précédant mon année d'inscription"
      'Ma première inscription dans le cursus (Licence ou Master) à Paris 1 date de 2025 ou avant, sans interruption': 'Ma première inscription dans le cursus (Licence ou Master) à Paris 1 date de 2025 ou avant, sans interruption'
      'Je redouble': 'Je redouble'
      'Je suis en classe préparatoire (CPGE)': 'Je suis en classe préparatoire (CPGE)'
      "Je m'incris en Doctorat ou en HDR (Habilitation à Diriger des Recherches) à Paris 1": "Je m'incris en Doctorat ou en HDR (Habilitation à Diriger des Recherches) à Paris 1"
      "Je viens d'un des 44 pays inscrit sur la liste des pays les moins avancés (PMA) définis par l’ONU": "Je viens d'un des 44 pays inscrit sur la liste des pays les moins avancés (PMA) définis par l’ONU*"
      'Moi (ou au moins un de mes parents directs) a le statut de réfugié ou bénéficie de la protection subsidiaire': 'Moi (ou au moins un de mes parents directs) a le statut de réfugié ou bénéficie de la protection subsidiaire'
      "Je viens d'un de ces pays : Islande , Liechtenstein, Norvège, Suisse, Andorre, Monaco, Québec": "Je viens d'un de ces pays : Islande , Liechtenstein, Norvège, Suisse, Andorre, Monaco, Québec"
      "J'ai une Bourse du Gouvernement Français (BGF)": "J'ai une Bourse du Gouvernement Français (BGF)"
      "J'ai une carte de résident de longue durée": "J'ai une carte de résident de longue durée"
      "J'ai un titre de séjour d'un an": "J'ai un titre de séjour d'un an"
      "J'ai une bourse ou un financement de mon pays d'origine (ou autre que la France)": "J'ai une bourse ou un financement de mon pays d'origine (ou autre que la France)"
      "Je déclare mes impôts depuis l'année dernière": "Je déclare mes impôts depuis l'année dernière"
      "J'ai obtenu ma Licence à Paris 1, cette année je m'inscris en Master 1": "J'ai obtenu ma Licence à Paris 1, cette année je m'inscris en Master 1"
