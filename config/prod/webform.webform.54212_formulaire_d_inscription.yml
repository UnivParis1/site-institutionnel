title: "203 - Formulaire d'inscription Campus des élus"
description: "<p>Formulaire d'inscription Campus des élus</p>"
categories: {  }
elements: |-
  mention_obligatoire:
    '#type': processed_text
    '#text': "<p><strong>Les champs suivis d'un astérisque * sont obligatoires.</strong></p>"
    '#format': full_html
  mes_informations:
    '#type': webform_wizard_page
    '#title': 'Mes informations '
    '#open': true
    civilite0:
      '#type': radios
      '#title': Civilité
      '#options':
        'Madame ': 'Madame '
        'Monsieur ': 'Monsieur '
        'Ne souhaite pas répondre ': 'Ne souhaite pas répondre '
      '#required': true
      '#options__properties': ''
    nom:
      '#type': textfield
      '#title': 'Nom '
      '#title_display': before
      '#required': true
    prenom:
      '#type': textfield
      '#title': 'Prénom '
      '#title_display': before
      '#required': true
    courriel:
      '#type': email
      '#title': 'Courriel '
      '#title_display': before
      '#required': true
    telephone:
      '#type': tel
      '#title': Téléphone
    situation:
      '#type': radios
      '#title': 'Situation '
      '#options':
        'Maire ': 'Maire '
        'Adjoint.e au maire': 'Adjoint.e au maire'
        'Conseiller.e municipal.e': 'Conseiller.e municipal.e'
        'Conseiller.e régional.e ': 'Conseiller.e régional.e '
        'Conseiller.e départemental.e ': 'Conseiller.e départemental.e '
        Autres: Autres
      '#options__properties': ''
      '#required': true
    precisez2:
      '#type': textfield
      '#title': Précisez
      '#states':
        visible:
          ':input[name="situation"]':
            value: Autres
    collectivite:
      '#type': textfield
      '#title': 'Collectivité '
      '#required': true
  formation_a_laquelle_je_souhaite_m_inscrire:
    '#type': webform_wizard_page
    '#title': "Formation à laquelle je souhaite m'inscrire "
    '#open': true
    comment_avez_vous_eu_connaissance_du_campus_des_elus:
      '#type': textfield
      '#title': 'Comment avez-vous eu connaissance du Campus des élus ?'
      '#required': true
      '#required_error': 'le champ "Comment avez-vous eu connaissance du Campus des élus ?" est requis'
    intitule_exact_de_la_formation:
      '#type': textfield
      '#title': 'Intitulé exact de la formation à laquelle vous souhaitez vous inscrire'
      '#title_display': before
      '#required': true
    quelles_sont_vos_attentes_et_besoins_vis_a_vis_de_cette_formatio:
      '#type': textarea
      '#title': 'Quelles sont vos attentes et besoins vis-à-vis de cette formation ? '
      '#counter_type': character
      '#counter_minimum': 10
      '#counter_maximum': 500
    dates_de_la_session:
      '#type': textfield
      '#title': 'Date(s) de la session '
  mode_de_financement:
    '#type': webform_wizard_page
    '#title': 'Mode de financement '
    '#open': true
    financement:
      '#type': checkboxes
      '#title': 'Mode de financement '
      '#options':
        'Droit Individuel à la Formation des Elus ': 'Droit Individuel à la Formation des Elus '
        'Pris en charge par la collectivité ': 'Pris en charge par la collectivité '
        'Individuel ': 'Individuel '
      '#options__properties': ''
      '#required': true
  questionnaire_d_autopositionnement:
    '#type': webform_wizard_page
    '#title': "Questionnaire d'autopositionnement "
    quel_type_de_mandat_exercez_vous_actuellement:
      '#type': radios
      '#title': 'Quel type de mandat exercez-vous actuellement ? '
      '#options':
        'Commune (moins de 1 000 habitants)': 'Commune (moins de 1 000 habitants)'
        'Commune (1 000 à 3 500 habitants) ': 'Commune (1 000 à 3 500 habitants) '
        'Commune (3 500 à 10 000 habitants)': 'Commune (3 500 à 10 000 habitants)'
        'Commune (plus de 100 000 habitants)': 'Commune (plus de 100 000 habitants)'
        'Commune (10 000 à 100 000 habitants)': 'Commune (10 000 à 100 000 habitants)'
        Intercommunalité/EPCI: Intercommunalité/EPCI
        Département/Région: Département/Région
        Autres: Autres
      '#options__properties': ''
      '#required': true
    precisez3:
      '#type': textfield
      '#title': 'Précisez '
      '#states':
        visible:
          ':input[name="quel_type_de_mandat_exercez_vous_actuellement"]':
            value: Autres
    depuis_combien_de_temps_exercez_vous_un_mandat_electif:
      '#type': radios
      '#title': 'Depuis combien de temps exercez-vous un mandat électif ? '
      '#options':
        "Moins d'un an": "Moins d'un an"
        'Entre 1 et 3 ans': 'Entre 1 et 3 ans'
        'Entre 3 et 6 ans': 'Entre 3 et 6 ans'
        'Plus de 6 ans': 'Plus de 6 ans'
      '#required': true
      '#options__properties': ''
    comment_evaluez_vous_votre_niveau_de_connaissance_sur_le_theme_d:
      '#type': radios
      '#title': 'Comment évaluez-vous votre niveau de connaissance sur le thème de cette formation ?'
      '#options':
        Débutant(e): 'Débutant(e) -- Je découvre le sujet '
        ' Intermédiaire': " Intermédiaire -- J'ai quelques connaissances "
        Averti(e): 'Averti(e) -- Je maîtrise les bases et je cherche à approfondir'
        'Expérimenté(e) ': "Expérimenté(e)  -- Je pratique régulièrement et j'ai acquis une vraie expertise"
      '#required': true
      '#options__properties': ''
    avez_vous_deja_suivi_des_formations_sur_cette_thematique_si_oui:
      '#type': textarea
      '#title': 'Avez-vous déjà suivi des formations sur cette thématique ? Si oui, précisez'
      '#required': true
    quel_est_votre_objectif_principal_en_participant_a_cette_formati:
      '#type': checkboxes
      '#title': 'Quel est votre objectif principal en participant à cette formation ?'
      '#options':
        'Acquérir des bases solides sur le sujet ': 'Acquérir des bases solides sur le sujet '
        'Approfondir des connaissances existantes ': 'Approfondir des connaissances existantes '
        'Découvrir des outils concrets et directement applicables ': 'Découvrir des outils concrets et directement applicables '
        "Echanger avec d'autres élus sur leurs pratiques ": "Echanger avec d'autres élus sur leurs pratiques "
        'Autre ': 'Autre '
      '#required': true
      '#options__properties': ''
    precis:
      '#type': textfield
      '#title': Précisez
      '#states':
        visible:
          ':input[name="quel_est_votre_objectif_principal_en_participant_a_cette_formati[Autre ]"]':
            checked: true
    y_a_t_il_des_points_specifiques_que_vous_souhaitez_voir_abordes:
      '#type': textarea
      '#title': 'Y a-t-il des points spécifiques que vous souhaitez voir abordés, ou des questions que vous souhaitez soumettre aux formateurs ?'
      '#required': true
    en_validant_ce_formulaire_vous_consentez_au_traitement_de_vos_do:
      '#type': checkbox
      '#title': "En validant ce formulaire, vous consentez au traitement de vos données personnelles par les services de l'université et vous acceptez d'être recontactés. Pour en savoir plus sur l’utilisation de vos données et vos droits, vous pouvez écrire à : dpo@univ-paris1.fr"
      '#required': true
  actions:
    '#type': webform_actions
    '#title': "Bouton(s) d'envoi"
    '#submit__label': "Je m'inscris "
